<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 拡大・縮小を止める（ダブルタップで拡大されないように）。切り欠きの下まで使う -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="技術確認">
<meta name="theme-color" content="#1d2b1f">
<!-- Cloudflare Access の後ろに置くときに、manifest の読み込みにも認証のクッキーを付ける（R9） -->
<link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>技術確認（開けて守れ！）</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d2b1f; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
         font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; color: #fff; }
  #c { position: fixed; inset: 0; display: block; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top); display: flex; justify-content: space-between; padding: 6px 10px; pointer-events: none; font-size: 15px; }
  .bar button { pointer-events: auto; }
  button { font: inherit; font-size: 16px; min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 10px; border: 0; background: #f0e6d2; color: #222; }
  .panel { position: fixed; left: 12px; right: 12px; top: 22%; background: rgba(20,20,20,.94); border-radius: 14px; padding: 16px; display: none; }
  .panel.on { display: block; }
  .panel .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  textarea { width: 100%; box-sizing: border-box; height: 90px; font-size: 16px; } /* 16px 未満だと iOS が入力時に拡大する */
  #cover { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); font-size: 20px; }
  #cover.off { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar"><span id="hud">ウェーブ 1</span><button id="menu">記録</button></div>
<div id="shop" class="panel">
  <div>ショップ（保存しました）</div>
  <div class="row"><button id="buy">パックを買う（3コイン）</button><button id="next">次のウェーブへ</button></div>
</div>
<div id="save" class="panel">
  <div>記録の書き出し・読み込み</div>
  <textarea id="txt" aria-label="書き出しの文字"></textarea>
  <div class="row"><button id="copy">文字をコピー</button><button id="file">ファイルで保存</button><button id="load">貼った文字を読む</button><label><button id="pick">ファイルを読む</button><input id="fin" type="file" accept=".txt,text/plain" hidden></label><button id="close">とじる</button></div>
  <div id="msg"></div>
</div>
<div id="cover">タップで始める</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
