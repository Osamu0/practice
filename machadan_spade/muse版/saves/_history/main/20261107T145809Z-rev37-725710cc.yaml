session_log:
  previous: ''
  entries:
  - Day1朝 ぬれねずみ亭を出て銀の天秤亭へ向かう途中、西大通りで調香師セレナ（22歳・その場の出会い）とぶつかる。婚約者とギルド前で待ち合わせ中。移動イベント d10=1、種別 d10=5（出会い）
  - Day1朝 西大通り。〇〇が骨折したふりをして治療費を匂わせる。CHM対抗 22 vs セレナINT 21で成功、セレナは信じて治療代50Gを差し出そうとしている（未受領）
  - Day1朝 〇〇が50Gでは足りないと詰め寄る。セレナは手持ちが銀貨5枚(50G)だけと明かし、店の商品『白百合の香油』(30G相当)を上乗せして差し出す。婚約者の冒険者ガルドが苛立って近づいてくる
  - Day1朝 〇〇はセレナの治療代50Gをしれっと受け取り、ガルドに『話し合いをしていただけ』と言う。香油は受け取っていない
