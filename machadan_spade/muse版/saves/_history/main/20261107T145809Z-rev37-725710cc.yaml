    通貨_銀貨:
      fact: ノワールで流通する銀貨1枚は10G
      source: Day1 セレナとの会話
    人物_セレナ:
      name: セレナ
      age: 22
      role: 調香師。西大通り脇の路地を入ってすぐの香水店『白百合香房』の店主
      appearance: 長身でモデル体型、胸は大きめ。亜麻色の髪を結い上げ、白い詰め襟のワンピース。灰色がかった青い瞳
      personality: 清楚で礼儀正しく、取り乱さない。責任感が強い。押しの強い相手に弱く、内心では強く出られることに少し胸を高鳴らせる
      relation: Day1朝、〇〇とぶつかり治療代50Gを渡した。婚約者ガルドに人前で叱られることが多い様子
      status: 確定した事実
    人物_ガルド:
      name: ガルド
      age: 29
      role: D級冒険者。革鎧に長剣。セレナの婚約者
      personality: 短気で嫉妬深い。人前でもセレナを叱りつける。酒好きで見栄っ張り。機嫌のいい時だけ優しい
      history: 三年前、街道で野盗に絡まれたセレナを助けたのが出会い。二年前に婚約。結婚は『大きな仕事を取ってから』と先延ばしが続いている。セレナの売上から毎月二千G近くを立て替えさせている
      relation: Day1朝、西大通りで〇〇に気圧されて引き下がり、セレナを置いて銀の天秤亭へ入った
      status: 確定した事実（経緯はセレナの話）
    出会い_Mia_001:
      character_id: Mia_001
      met_day: 1
      knows_name: true
      fact: Day1朝、白百合香房への路地口で会う。ガルドとの一件と仮病を見ていたが、〇〇に口止めされて内緒にすると約束した
      status: 確定した事実
    場所_白百合香房:
      place_id: LORE_SHIRAYURI_KOUBOU
      parent: NOIR_CITY_WEST
      name: 白百合香房
      owner: セレナ
      position: 西大通りから路地を一本入って角を曲がった先
      structure: 石造り二階建ての小さな店。1F南側が売り場（入口の扉に鈴、窓辺の棚、奥にカウンター）、カウンター裏の暖簾の奥が調香室。調香室の奥に裏口と2Fへの階段。2Fはセレナの住まい
      rooms:
        LORE_SHIRAYURI_KOUBOU_SHOP: 売り場
        LORE_SHIRAYURI_KOUBOU_WORKROOM: 調香室
        LORE_SHIRAYURI_KOUBOU_UPSTAIRS: 2Fの住まい（私室）
      status: 確定した事実
    白百合香房_客層:
      fact: 昼過ぎから夕方が混む。客は『蜜の味』の娼婦、商家の奥方、贈り物を探す冒険者。調合の注文は十日先まで埋まっていて繁盛している。売上の多くを婚約者ガルドの装備代や酒代の立て替えに回していて、店の金を月末まで動かせない
      status: セレナ本人の話
    白百合香房_売上:
      fact: 売上は月におよそ8,000G。材料と瓶代、家賃を引いて手元に残るのは3,000G前後。そのうち2,000G近くをガルドの立て替えに回している。店の金は月末の締めまで動かさない決まり
      status: セレナ本人の話
    ミアの情報_ガルド:
      fact: ガルドは昼過ぎに南東の歓楽通りの賭場『銀蛇亭』に通い、負けが込んで金貸しのバルトに約3,000Gの借りがある。返済の当てとして、セレナの店『白百合香房』の権利を担保に入れる話をバルトとしているのをミアが聞いた。歓楽通りの娼婦にも馴染みがいるらしい
      source: ミアの目撃と立ち聞き。Day1に〇〇が30Gで購入
      status: ミアの情報（未確認の部分あり）
    密約_ミアとガルド排除:
      parties:
      - 〇〇
      - Mia_001
      agreed_in_principle: true
      plan: ガルドを嵌めてセレナの前から消す。その後、白百合香房の客を増やし、セレナから〇〇の借金返済に月1,000Gを回してもらう（セレナ本人の同意が前提）。セレナの客をミアの店へ紹介する
      mia_terms: 白百合香房の瓶の卸をミアの店が独占する／香房の会計台にミアの店の案内札を置く。手間賃は取らない代わりに、〇〇が冒険で得た素材をまずミアの店に持ち込む
      status: 〇〇がミアの3条件を呑み、口約束で手を組んだ。セレナの同意とガルドの件はまだ
    人物_バルト:
      name: バルト
      age: 45
      role: 南東の歓楽通りで賭場『銀蛇亭』の裏手に事務所を構える金貸し
      appearance: 小太りで、指に太い金の指輪を三つ。いつも甘い葉巻の匂いをさせている
      personality: 笑顔は崩さないが、取り立ては手下に容赦なくやらせる。表向きは商人で、衛兵の前では手を汚さない
      relation: ガルドに約3,000G貸している。白百合香房の権利書を借金のカタに欲しがっている
      status: ミアの話
    ノワールの権利書:
      fact: ノワールの店の権利書は役所の透かし入り羊皮紙に書かれ、街の代表ロザリアの封蝋と登録番号が押されている。紙とペンだけでは似せられない。本物と照らし合わせれば役所ですぐ見分けがつく
      status: ミアの説明
