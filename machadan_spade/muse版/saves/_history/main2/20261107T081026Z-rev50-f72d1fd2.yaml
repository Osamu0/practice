      kind: shop
      place_id: CENTRAL_PLAZA
      room_id: CENTRAL_PLAZA_STALLS
      fact: 中央広場南西の露店列のいちばん端、紫の布をかけた屋台。老婆がお香と干した花を売る。品揃えと価格は未確定。
      status: confirmed
    場所_白百合香房:
      kind: shop
      place_id: LORE_SHIRAYURI_KOUBOU
      parent: NOIR_CITY_WEST
      name: 白百合香房
      owner: セレナ
      position: 西大通りの路地口から路地をまっすぐ入り、ひとつ目の角を右。白い百合の看板の小さな石造りの店。扉に鈴
      fact: 香水の店。店主セレナが奥で一つずつ調合し、客に合う香りを選ぶ。昼過ぎから夕方が混む。リゼットの香りもここで作ったもの。構造・品揃え・価格は初訪問時に確定する。
      status: 確定（リゼットの話）
      structure:
        outline: 灰色の石積みの二階建ての小さな店。1F南側が売り場（入口の扉に鈴、窓辺の小瓶の棚、奥にカウンター）。カウンター裏の暖簾の奥が調香室。調香室の奥に裏口と2Fへの階段。2Fはセレナの住まい（私室）
        rooms:
          LORE_SHIRAYURI_KOUBOU_SHOP: 売り場
          LORE_SHIRAYURI_KOUBOU_WORKROOM: 調香室
          LORE_SHIRAYURI_KOUBOU_UPSTAIRS: 2Fの住まい（私室）
        customers: 夕方は娼婦・商家の奥方・贈り物を探す冒険者で混む
      rooms_2f: 2Fは廊下を挟んでセレナの私室と、亡き（または不在の）父が使っていた部屋。父の部屋は内側から鍵がかかり、寝台と毛布がある
      rooms_detail:
        LORE_SHIRAYURI_KOUBOU_WORKROOM: 調香室。壁一面の硝子瓶の棚、作業台（天秤・漏斗・硝子管）、小さな炉。奥の壁際に鍵の掛かった小さな木箱（配合の書き付けと思われる）。奥に裏口と二階への細い木の階段
        LORE_SHIRAYURI_KOUBOU_FATHER_ROOM: 二階の左の扉。窓ひとつ、寝台、古い机と椅子、衣装棚。清潔。内側から鍵
        LORE_SHIRAYURI_KOUBOU_UPSTAIRS: 二階の右の扉がセレナの私室
        kitchen: 台所は一階（位置は調香室の脇と補完）
      kitchen: 一階、調香室の脇の小さな扉の向こう。石の竈、吊るした香草の束、小さな木の卓、勝手口
    人物_セレナ:
      kind: npc
      name: セレナ
      age: 32
      role: 調香師。白百合香房の店主
      appearance: 身長164cmの長身でモデル体型、胸は豊満で腰が細い。亜麻色の髪をきっちり結い上げ、白い詰め襟のワンピース。灰色がかった青い瞳。実年齢より若く、二十歳過ぎに見える（老化がゆっくり）
      personality: 好み寄せ：清楚で可愛い系。取り乱さず礼儀正しい。一人称わたくし、丁寧語。無駄な干渉をせず、相手を立てる。店を自分で切り盛りして稼いでいる
      generation_rolls: 好み判定2(好み寄せ)/副性格付与6(なし)/年齢9,8→32/身長3,5→164
      relation: Day1昼、白百合香房への路地口で〇〇にぶつかり、干し花の籠を落とした。店でのお詫びを申し出た
      status: 確定
      stats:
        str: 6
        def: 6
        int: 4
        spd: 6
        tec: 5
        chm: 6
        note: 非戦闘の店主。村人型を土台にCHM+1・INT-1
    白百合香房_評判:
      fact: セレナの香水は娼館『蜜の味』でいちばん人気。調合の注文は十日先まで埋まっている。セレナは32歳だが年下に見える。ずっと独り身で、言い寄る男は多いが仕事一筋
      source: Day1夕、店内で娼婦二人組の噂話
      status: 噂
    白百合香房_材料の買い付け:
      fact: セレナは香水の材料をいつも決まった業者から買うが、裏山の花や森の樹脂は不足しがち。冒険者が採ってくれば相場どおりに買い取ると申し出た。品目・量・価格は未確定（正式な依頼にする時に確定）
      status: セレナの申し出（Day1夕）
    白百合香房_売上:
      fact: 売上はひと月およそ8,000G。材料・瓶・家賃を払うと手元に残るのは3,000G前後（花や樹脂が高い季節はもっと減る）。調合の注文は十日先まで。セレナひとりで調合・仕入れ・帳簿をこなす。父から継いで十年。店の金は月末の締めまで動かさない決まり
      status: セレナ本人の話（Day1夕）
    取り決め_セレナ月1000G:
      parties:
      - 〇〇
      - セレナ
      terms: 毎月の締めのあと、セレナが〇〇へ1,000Gを渡す。初回は1年1月の締め（30日目）のあと。名目は売上を上げる手伝いへのお礼。〇〇は白百合香房の売上が上がるよう協力する（方法は未定）
      record: セレナの帳面に日付・金額・名前を記入
      status: 成立（口約束）
      origin: Day1夕。治療の借金を負わせたというセレナの負い目と交渉判定（24対15）で成立
    素材_白鈴花と琥珀樹脂:
      fact: 白百合香房の主材料。白鈴花は裏山の斜面（洞窟の入口近く、魔物が出ることがある）に咲く。琥珀樹脂は東の森の木から採れる。業者からの仕入れは量が足りず値上がり中。セレナは材料不足で注文を多数断っている（帳面の赤線）。量・売値・採取判定は正式な依頼にする時に確定し、入手時にdiscoveriesへ記録する
      status: セレナの話（Day1夕）
    白百合香房_人を雇わない理由:
      fact: 売り子一人の給金は街の相場でひと月およそ1,000G。配合は父の代からの秘伝で、調香室に入れるのはよほど信頼できる者だけ。以前、手伝いの者に配合を写して他所へ持ち出されたことがある
      status: セレナ本人の話（Day1夜）
    白百合香房_裏口:
      fact: Day1夜、セレナが裏口の閂を外し、戸の脇に灯りを残してくれた。〇〇は戻る時に裏口から入れる（今夜限りの好意）
      status: 確定
    人物_ドルフ:
      kind: npc
      name: ドルフ
      age: 67
      role: 東裏路地で質屋を営む老人
      appearance: 小柄、白髪まじりの長い髭、片目に拡大鏡、指に煤
      fact: Day1夜、路地で大声で金の話をする〇〇を見て、溝鼠に気をつけろと忠告。今夜中に南東の歓楽通りの客へ預かり物を届ける護衛を頼みたいと持ちかけた。礼は出すという（内容未確定）
      status: 確定
    集団_溝鼠:
      kind: gang
      name: 溝鼠
      fact: 夜の東裏路地の暗い角にたむろするごろつき集団。全部で4〜5人。頭は片耳のギース（大柄、棍棒、昔衛兵とやり合って耳を半分なくした）。ほかはナイフを持った細身の男2〜3人（冒険者のなりそこない）。夜はギースと1〜2人が角に陣取り、通行人から財布を巻き上げる。殺しまではしない。見回りが少なく衛兵も本腰を入れていない。先週ドルフの小僧の荷を盗りかけた。戦闘値は戦闘開始時に確定
      status: ドルフの話
    人物_ロゼ:
      kind: npc
      name: ロゼ
      role: 娼館『蜜の味』の娼婦
      fact: 三月前に亡母の形見の銀の首飾りをドルフの質屋に入れ、Day1に利息ごと請け出した。帰り道で溝鼠に絡まれたことがあり路地に来られない。年齢・外見は初対面時に確定（成人）
      status: ドルフの話
