      result: 4
      cursor: 68
    random_event_type_roll:
      die: d10
      result: 6
      cursor: 69
  - day: 1
    time_of_day: 夕
    summary: 『医者に診せて良くなったが借金になった、遠くから来たばかりで世界のことも分からない』と話した。セレナは安堵したうえで責任を感じ、治療の借金を月の締めのあとに一部持つこと、街の案内、裏山の花や森の樹脂の買い取りを申し出た。
    note: 大聖堂へは実際には行っていない。治療の借金はセレナの思い込み
  - day: 1
    time_of_day: 夕
    summary: 店を褒めて繁盛ぶりを尋ねた。セレナは客層、注文が十日先まで埋まっていること、月の売上約8,000G・手残り約3,000G、父から継いで十年ひとりで切り盛りしていることを話し、なぜこの店を知っていたのか尋ねた。
  - day: 1
    time_of_day: 夕
    summary: 噂で店を知ったと答え、毎月1,000Gを渡してほしい、代わりに売上を上げる協力をすると持ちかけた。交渉判定に成功（24対15）。セレナは受け入れ、毎月の締めのあと（初回は今月末）に『手伝いへのお礼』として渡すと帳面に記した。協力の方法を尋ねられた。
    check:
      type: CHM対抗
      player: 24
      target: 15
      dice:
      - 6
      - 7
      - 3
      - 6
      cursor_from: 70
      modifiers: 負い目+1／大きな要求-2
  - day: 1
    time_of_day: 夕
    summary: 何が一番大変か尋ねると、セレナは材料不足（裏山の白鈴花・東の森の琥珀樹脂）を挙げ、断った注文の多さを帳面で見せた。材料集めがいちばん店のためになると提案した。
  - day: 1
    time_of_day: 夜
    summary: 人を雇わないのか尋ねた。セレナは給金（月1,000G前後）と配合の秘密（以前に持ち出された）を理由に挙げた。日が暮れ、宿は決まっているかと尋ねられた。
  - day: 1
    time_of_day: 夜
    summary: 宿は決まっていないと答えた（実際にはぬれねずみ亭がある）。セレナは手持ちの金がなく、店の金も締めまで動かせないため、二階の父の部屋（鍵付き）に泊まるよう申し出た。簡単な食事も出すという。
  - day: 1
    time_of_day: 夜
    summary: セレナの申し出を受け、二階の父の部屋に泊めてもらうことにした。調香室を通って二階へ案内された（父以外では初めて通された、とセレナの内心）。塩漬けの豚を焼いて夕食を出すという。セレナの部屋は向かい。
  - day: 1
    time_of_day: 夜
    summary: 父の部屋でベルと作戦会議。手持ち50G・Day5の取立て500G、セレナからの1,000Gは月末、仮病と宿の嘘がばれる危険、稼ぎ口（材料集め・ギルド依頼）と前衛の仲間の必要を整理した。
  - day: 1
    time_of_day: 夜
    summary: ベルに『街の辺鄙な所でチンピラと喧嘩して本当に骨を折り、治療を受け、ついでに金品も』と持ちかけた。ベルは、主人公は誓いで戦えない、こちらから仕掛けると暴行・強盗でシルヴィアに捕まり借金+3,000G、向こうから絡まれた返り討ちなら正当、治療は傷の分だけ高い、と指摘した。夕食の支度ができたとセレナが呼んだ。
  - day: 1
    time_of_day: 夜
    summary: 夜になってから喧嘩の計画を実行すると決め、ベルも了承（殴られ役は主人公）。セレナの台所で夕食（塩漬け豚の焼いたもの・黒パン・豆の煮込み・白鈴花入りの蜂蜜酒）。ベルには骨付きの切れ端。セレナは父がいなくなってから久しぶりの二人の夕食だと感じ、どこから来たのか尋ねた。
  - day: 1
    time_of_day: 夜
    summary: 『この世界とは別のところから来た』と答えた。セレナはそれ以上詮索しなかった。夕食後に出かけると告げると、行き先も聞かずに裏口の閂を外し、灯りを残すと言ってくれた。ベルと夜の街へ出る支度をした。
  - day: 1
    time_of_day: 夜
    summary: セレナに見送られて裏口から出て、夜の中央広場を抜け、ミア店脇の東裏路地へ入った。灯りの漏れる戸の奥で硬貨を数える気配と話し声。先の暗い角の向こうにも人の気配があるが、まだ誰も出てこない。
