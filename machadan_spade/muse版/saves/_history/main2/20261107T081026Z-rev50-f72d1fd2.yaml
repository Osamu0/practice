    summary: ミルカの受付で冒険者登録を始め、名前を記入。職業を魔道版に念じるよう求められた。仲間募集の三人は登録済みの者と組む規則だと聞いた。
  - day: 1
    time_of_day: 朝
    summary: 自作の職業『召喚士』（自分は戦わず、使い魔を最大3体同時に呼ぶ）を魔道版に念じ、技4つの案が提示された。署名待ち。
  - day: 1
    time_of_day: 朝
    summary: 召喚士の案を、常にそばにいて会話でき、主人公の成長に比例する相棒を持つ形へ改訂してもらった（代償：本人は攻撃しない、相棒は火を持てない）。署名待ち。
  - day: 1
    time_of_day: 朝
    summary: 召喚士として署名し、冒険者登録（E級）を終えた。相棒ベル（肩に乗る小さな黒い獣、主人公と同じ気質）と契約した。ミルカから街を散策するのも良いと勧められた。
  - day: 1
    time_of_day: 朝
    summary: ベルは肉の食事で手を打った。街をぶらつき中央広場へ。噴水で狐の獣人コノハ（18）に『サキュバスなの！』と声をかけられ、学園編入のために手ほどきを頼まれた。
    random_event_roll:
      die: d10
      result: 5
      cursor: 41
    random_event_type_roll:
      die: d10
      result: 2
      cursor: 42
  - day: 1
    time_of_day: 朝
    summary: コノハの頼みを『また今度』と断った。コノハはめげずに次の男へ声をかけに行った。所持金がなく、ベルから肉の当てを考えろと言われた。
  - day: 1
    time_of_day: 昼
    summary: ギルドに戻り、記入卓で仲間候補の騎士エステル・魔法使いリゼット・武闘家メイリンと顔を合わせた。どんな仲間を探しているか尋ねられた。
    random_event_roll:
      die: d10
      result: 9
      cursor: 55
    ambient_roll:
      die: d10
      result: 6
      cursor: 56
  - day: 1
    time_of_day: 昼
    summary: 仲間候補の三人に香りの店を尋ねた。リゼットからミアの道具屋の香油、メイリンから広場南西の露店列の端にある紫の布のお香屋台を教わった。エステルは護衛を申し出た。
  - day: 1
    time_of_day: 昼
    summary: セレナの店を尋ねると、リゼットが香水の店『白百合香房』（西大通りから路地を入った先）を教えた。昼過ぎから混むので今がよいとのこと。エステルが案内を申し出た。
  - day: 1
    time_of_day: 昼
    summary: エステルの案内を断り一人で白百合香房へ。路地口で、届け物帰りのセレナとぶつかり、干し花が散った。セレナは丁寧に詫び、店でのお詫びを申し出た。
  - day: 1
    time_of_day: 昼
    summary: 骨が折れたふりをし、ベルが口裏を合わせた。だましの判定に成功（19対17）。セレナは怪我を信じ、治療代50Gか大聖堂への付き添いを申し出た（未回答）。
    check:
      type: CHM対抗
      player: 19
      target: 17
      dice:
      - 5
      - 1
      - 5
      - 6
      cursor_from: 63
  - day: 1
    time_of_day: 昼
    summary: 50Gでは足りないと迫った。セレナは取り乱さずに非を認め、仕事ができない分も含めていくら必要か尋ねてきた。店の金は月末の締めまで動かさない決まりにしている（セレナの内心）。
  - day: 1
    time_of_day: 昼
    summary: 医者に診てもらってから相談しに行くと伝え、白百合香房の場所（路地をまっすぐ、ひとつ目の角を右）を聞いた。ベルが名乗り、セレナは〇〇とベルの名を覚えた。セレナはせめて診察代として50Gを差し出している（未回答）。
  - day: 1
    time_of_day: 夕
    summary: セレナから診察代50Gを受け取った。時間を空けて、夕方に白百合香房へ。店には娼婦二人と商家の奥方の客がいた。セレナが接客を中断して迎え、怪我の具合を尋ねた。大聖堂には実際には行っていない。
    ambient_roll:
      die: d10
      result: 9
      cursor: 67
  - day: 1
    time_of_day: 夕
    summary: 客がはけるまで店内で待った。娼婦二人組の噂話で、セレナの香水が蜜の味で人気、注文は十日先まで埋まっている、32歳でずっと独り身だと聞いた。客が帰ると、セレナは入口の札を裏返し、大聖堂の結果を尋ねた。
