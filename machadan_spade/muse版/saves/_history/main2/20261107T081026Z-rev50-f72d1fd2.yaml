  - day: 1
    time_of_day: 夜
    summary: ドルフから溝鼠のことを聞いた。全部で4〜5人、頭は片耳のギース（大柄・棍棒）、夜は角にギースと1〜2人。殺しはしない。武器を持っていないことを見咎められ、ベルが『得物は俺だ』と名乗った。
  - day: 1
    time_of_day: 夜
    summary: ドルフに報酬と届け物を尋ねた。中身は蜜の味のロゼの亡母の形見の銀の首飾り（鍵付きの黒い小箱）。報酬は現金350G（ロゼの受け取りの一筆と引き換え）と質流れ品の2割引1回。前金なし、盗られたら報酬なし。角から溝鼠の笑い声が聞こえた。
    reward_value_roll:
