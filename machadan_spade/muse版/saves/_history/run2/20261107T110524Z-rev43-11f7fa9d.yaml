  - Day1朝 西大通り。〇〇が『医者には自分で行くから誠意を』と求める。クラリスは少し引っかかりつつも争わず、手持ちの銀貨5枚（50G）を見舞金として差し出す（未受領）。骨に障りがあれば工房を訪ねてと告げる
  - Day1朝 西大通り。〇〇がクラリスの見舞金50Gを受け取り、後で『白糸の間』へ顔を出すと告げる
  - Day1朝 〇〇が路地の石壁に腕をぶつけて打ち身を作る（LP33→32）。中央広場を抜けて大聖堂の治療受付へ。移動 d10=8（なし）、環境 d10=10（なし）。エレナが痣に見入りつつ治療を申し出る（1LP=2G、未実施）
  - Day1朝 大聖堂の治療受付。〇〇が何をしている所か尋ね、エレナが治療・礼拝・告解・聖水の泉、冒険者への危ない頼み事を案内する。打ち身は未治療
  - Day1朝 大聖堂の治療受付。〇〇がエレナの本音を笑って指摘。エレナは傷を見るとどきどきすると打ち明け、腕の打ち身を治療（LP32→33、2G支払い）。治療後のエレナは上気して熱っぽい
  - Day1朝 大聖堂。〇〇が治療費のオマケを求めるが、エレナは値引きを断る。代わりに次の怪我はいちばんに丁寧に診ると約束（料金は通常どおり）。わざと怪我するのはだめと釘を刺す
  - Day1朝 大聖堂。〇〇が『オマケがないならもう来ない』と告げて去る。エレナは涙ぐみつつも値引きはせず、いつでも来てと見送る。〇〇は大聖堂の前庭へ。霧が晴れる
  - Day1朝 クラリスの店へ向かう途中、中央広場の西口手前で焼き菓子屋台の娘（20歳前後・赤いバンダナ）が、溝にはまった屋台車を押せず困っている。手伝いを頼まれる。移動イベント d10=1、種別 d10=4（困っている人）
  - Day1朝 中央広場。〇〇がタダでは手伝わないと告げる。ポーラ（20歳）は現金がなく、礼として蜂蜜焼き3個入り1包み（15G相当）を提示（未受領）。また買いに来ればひとつオマケすると言う
  - Day1朝 中央広場。〇〇が屋台車を押す。STR 8+2d10(1,10)=19 vs 標準19で成功。車輪が溝から抜け、ポーラから蜂蜜焼き（3個入り）1包みを受け取る
  - Day1昼前 〇〇がクラリスの『白糸の間』を訪ねる。移動 d10=7（なし）、環境 d10=5（なし）。仮縫いのローレンス夫人を見送ったクラリスが、体の具合と大聖堂に行ったかを尋ねる
  - Day1昼前 白糸の間。〇〇が治療で借金になったと匂わせ、この世界に来たばかりだと話す。CHM対抗 12 vs クラリスINT 17で失敗。クラリスは治療で借金とは信じないが、来たばかりで借金があることは受け入れ、深く詮索しない。服が体に合っていないと指摘し、お茶を勧める
  - Day1昼前 白糸の間。〇〇が『借金も君がぶつかったせい』と重ねる（判定なし）。クラリスは穏やかに、本当なら請求の書付けを見せてほしい、一緒に行って払うと返す。お金の話は終わりにしてお茶を淹れ始める
  - Day1昼前 白糸の間。〇〇がお茶を断り、一人で店をやっているのか尋ねる。クラリスは開業4年、一人で切り盛りし、客筋は屋敷の奥方と冒険者だと話す。2階に一人暮らしで夜は静かすぎると漏らす
  - Day1昼 白糸の間。〇〇がお詫びに装備を作ってと頼む。クラリスはタダは断りつつ、冒険者の服（50G・DEF+1・重量1）の仕立てを提案。明朝渡し、不足分は受取時でよい（未注文）
  - Day1昼 白糸の間。〇〇が冒険者の服を40Gに値切る。CHM 8+2d10(2,5)=15 vs 標準19で失敗、50Gのまま。クラリスは生地と縫製を説明し、肩幅をきっちり合わせると約束（未注文）
  - Day1昼 白糸の間。〇〇が45Gを提示（同じ値切りの繰り返しのため判定なし）。クラリスは笑いつつ50Gを譲らず、注文すれば裏地の色を選べるオマケを提案
  - Day1昼 白糸の間。〇〇が50Gで冒険者の服を注文し、股関節まわりの採寸を頼む。クラリスが採寸、股下で大きさに気づいて赤面しつつ前のゆとりを多めに取る。48Gを支払い、残り2Gは明朝の受取時
  - Day1昼 白糸の間。〇〇が『前のゆとり』をからかう。クラリスは真っ赤になり、仕立ての決まりと説明しつつ『ふつうより多めに』と漏らし、『意地悪、分かってて聞いてる』と甘く返す
  - Day1昼 白糸の間。〇〇が『見てみる？』と誘う。クラリスは扉に鍵を掛け木札を裏返しカーテンを引き、膝をついてベルトを外す。〇〇のおちんぽの大きさに見入り、触って確かめていいかと上目遣いで尋ねる（エロシーン開始）
  - Day1昼 白糸の間。〇〇が好きなだけ触って嗅いでいい、まだ完全には勃っていないと告げる。クラリスが握り、さらに大きくなるのに驚いて巻き尺で測り、匂いを嗅いで先っぽにキス。奉仕が好きだと打ち明け、口で確かめたいとねだる
  - Day1昼 白糸の間（エロシーン中）。〇〇がしたいなら値段をまけてと言う。クラリスはお代はお代と断り50Gのまま。代わりに『お代じゃなく自分がしたいから』一生懸命ご奉仕すると囁き、口でさせてとねだる
  - Day1昼 白糸の間（エロシーン中）。〇〇が値引きしないならお預けと揺らして焦らす。クラリスは涙目で欲しがりつつも50Gは譲らない。代わりに値段以外なら何でも言うことを聞くと頬ずりしてねだる
  - Day1昼 白糸の間（エロシーン中）。〇〇が『うんと言えばすぐありつける』と迫る。クラリスは言ったら負けと拒み、逆に〇〇の先走りを指摘して胸元のボタンを外し、レースの下着の胸を見せて『わたしもお預け』と挑発。50Gのまま全部を好きにするか、お預けし合うかと問う
  - Day1昼 白糸の間（エロシーン中）。〇〇が『採寸で興奮する変態だと言いふらす』と脅す。CHM対抗 18 vs クラリスINT 19で失敗（かすり）。クラリスは涙目で値引きは拒みつつ、残り2Gを免除。誰にも言わないで、自分の変態さは〇〇だけが知っていてと甘く懇願
  - Day1昼 白糸の間（エロシーン中）。〇〇がここに泊まっていいかと尋ねる。クラリスは2階は狭いと言いつつ、今夜もその先も泊まってよいと承諾。宿代はいらないと言い、夜は静かにさせないでと甘える
  - Day1昼 白糸の間（エロシーン中）。〇〇が宿泊を決め、しゃぶっていいと許す。クラリスがフェラ。先っぽから竿の半ばまで咥え、手でしごきつつスカート越しに自分を慰める。気持ちいいか、もっと奥か、口に出すかと尋ねる
  - Day1昼 白糸の間（エロシーン中）。〇〇がもっと奥までと煽る。クラリスが涙を零しながら喉の奥まで根元まで咥え込み、ゆっくり喉で扱く。スカート越しに自分も擦り、褒めてと見上げ、いっぱい出してとねだって再び咥える
  - Day1昼 白糸の間（エロシーン中）。〇〇が『君の口はオナホ』と言いかける。クラリスは意味を推し量り『殿方が気持ちよくなる道具』と理解して昂ぶり、手を膝に揃えて口を大きく開け舌を差し出し、頭をつかんで好きに使ってとねだる
  - Day1昼 白糸の間（エロシーン中）。〇〇がクラリスの頭を掴み、遠慮なく喉の奥まで突き込む。クラリスはスカートの中で自分を擦りながら喉を使われ、潮を吹いて絶頂。喉で搾りながら『全部のませて』と欲しがる（〇〇はまだ射精していない）
  - Day1昼 白糸の間（エロシーン中）。〇〇がオナホ扱いでイく変態、最高のオナホだと言う。クラリスは喜んで自分は変態だと認め、スカートをたくし上げて濡れた下着を見せ、おまんこもおなほにして奥で受け止めたいとねだる
