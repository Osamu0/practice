session_log:
  previous: ''
  entries:
  - Day1朝 ぬれねずみ亭201号室で〇〇が新しい肉体（178cm・引き締まった筋肉質）を得て目覚める。リリスが名乗り、初期借金10,000Gを告げる。リリスがハートの火を分ける提案をし、返事待ち
  - Day1朝 ぬれねずみ亭201号室。〇〇が「少し記憶がある」と言って火を受け取る。リリスの胸の火が〇〇の胸へ移り、6能力+3・LP上限+12。死に戻りの仕組みと代価の説明を受ける
  - Day1朝 ぬれねずみ亭201号室。初期配分確定（STR5/DEF5/INT8/SPD5/TEC5/CHM5）。リリスが帰還の腕輪を渡し、銀の天秤亭を勧め、目的なく街をぶらつくのも面白いと話す
  - Day1朝 〇〇がぬれねずみ亭を出て目的なく散策。西大通りで仕立て工房『白糸の間』のクラリス（26歳）とぶつかり、彼女の届け物のリボン箱が散らばる。移動イベント d10=1、種別 d10=5（出会い）
  - Day1朝 西大通り。〇〇が骨折したふりをする。CHM対抗 18 vs クラリスINT 19で失敗（かすり）。クラリスは骨折までは信じないが打撲を心配し、工房での手当てか大聖堂への同行を申し出る（費用は彼女持ち・未確定）
  - Day1朝 西大通り。〇〇が『医者には自分で行くから誠意を』と求める。クラリスは少し引っかかりつつも争わず、手持ちの銀貨5枚（50G）を見舞金として差し出す（未受領）。骨に障りがあれば工房を訪ねてと告げる
  - Day1朝 西大通り。〇〇がクラリスの見舞金50Gを受け取り、後で『白糸の間』へ顔を出すと告げる
  - Day1朝 〇〇が路地の石壁に腕をぶつけて打ち身を作る（LP33→32）。中央広場を抜けて大聖堂の治療受付へ。移動 d10=8（なし）、環境 d10=10（なし）。エレナが痣に見入りつつ治療を申し出る（1LP=2G、未実施）
  - Day1朝 大聖堂の治療受付。〇〇が何をしている所か尋ね、エレナが治療・礼拝・告解・聖水の泉、冒険者への危ない頼み事を案内する。打ち身は未治療
  - Day1朝 大聖堂の治療受付。〇〇がエレナの本音を笑って指摘。エレナは傷を見るとどきどきすると打ち明け、腕の打ち身を治療（LP32→33、2G支払い）。治療後のエレナは上気して熱っぽい
  - Day1朝 大聖堂。〇〇が治療費のオマケを求めるが、エレナは値引きを断る。代わりに次の怪我はいちばんに丁寧に診ると約束（料金は通常どおり）。わざと怪我するのはだめと釘を刺す
  - Day1朝 大聖堂。〇〇が『オマケがないならもう来ない』と告げて去る。エレナは涙ぐみつつも値引きはせず、いつでも来てと見送る。〇〇は大聖堂の前庭へ。霧が晴れる
  - Day1朝 クラリスの店へ向かう途中、中央広場の西口手前で焼き菓子屋台の娘（20歳前後・赤いバンダナ）が、溝にはまった屋台車を押せず困っている。手伝いを頼まれる。移動イベント d10=1、種別 d10=4（困っている人）
  - Day1朝 中央広場。〇〇がタダでは手伝わないと告げる。ポーラ（20歳）は現金がなく、礼として蜂蜜焼き3個入り1包み（15G相当）を提示（未受領）。また買いに来ればひとつオマケすると言う
  - Day1朝 中央広場。〇〇が屋台車を押す。STR 8+2d10(1,10)=19 vs 標準19で成功。車輪が溝から抜け、ポーラから蜂蜜焼き（3個入り）1包みを受け取る
  - Day1昼前 〇〇がクラリスの『白糸の間』を訪ねる。移動 d10=7（なし）、環境 d10=5（なし）。仮縫いのローレンス夫人を見送ったクラリスが、体の具合と大聖堂に行ったかを尋ねる
  - Day1昼前 白糸の間。〇〇が治療で借金になったと匂わせ、この世界に来たばかりだと話す。CHM対抗 12 vs クラリスINT 17で失敗。クラリスは治療で借金とは信じないが、来たばかりで借金があることは受け入れ、深く詮索しない。服が体に合っていないと指摘し、お茶を勧める
  - Day1昼前 白糸の間。〇〇が『借金も君がぶつかったせい』と重ねる（判定なし）。クラリスは穏やかに、本当なら請求の書付けを見せてほしい、一緒に行って払うと返す。お金の話は終わりにしてお茶を淹れ始める
  - Day1昼前 白糸の間。〇〇がお茶を断り、一人で店をやっているのか尋ねる。クラリスは開業4年、一人で切り盛りし、客筋は屋敷の奥方と冒険者だと話す。2階に一人暮らしで夜は静かすぎると漏らす
  - Day1昼 白糸の間。〇〇がお詫びに装備を作ってと頼む。クラリスはタダは断りつつ、冒険者の服（50G・DEF+1・重量1）の仕立てを提案。明朝渡し、不足分は受取時でよい（未注文）
  - Day1昼 白糸の間。〇〇が冒険者の服を40Gに値切る。CHM 8+2d10(2,5)=15 vs 標準19で失敗、50Gのまま。クラリスは生地と縫製を説明し、肩幅をきっちり合わせると約束（未注文）
  - Day1昼 白糸の間。〇〇が45Gを提示（同じ値切りの繰り返しのため判定なし）。クラリスは笑いつつ50Gを譲らず、注文すれば裏地の色を選べるオマケを提案
  - Day1昼 白糸の間。〇〇が50Gで冒険者の服を注文し、股関節まわりの採寸を頼む。クラリスが採寸、股下で大きさに気づいて赤面しつつ前のゆとりを多めに取る。48Gを支払い、残り2Gは明朝の受取時
  - Day1昼 白糸の間。〇〇が『前のゆとり』をからかう。クラリスは真っ赤になり、仕立ての決まりと説明しつつ『ふつうより多めに』と漏らし、『意地悪、分かってて聞いてる』と甘く返す
  - Day1昼 白糸の間。〇〇が『見てみる？』と誘う。クラリスは扉に鍵を掛け木札を裏返しカーテンを引き、膝をついてベルトを外す。〇〇のおちんぽの大きさに見入り、触って確かめていいかと上目遣いで尋ねる（エロシーン開始）
  - Day1昼 白糸の間。〇〇が好きなだけ触って嗅いでいい、まだ完全には勃っていないと告げる。クラリスが握り、さらに大きくなるのに驚いて巻き尺で測り、匂いを嗅いで先っぽにキス。奉仕が好きだと打ち明け、口で確かめたいとねだる
  - Day1昼 白糸の間（エロシーン中）。〇〇がしたいなら値段をまけてと言う。クラリスはお代はお代と断り50Gのまま。代わりに『お代じゃなく自分がしたいから』一生懸命ご奉仕すると囁き、口でさせてとねだる
  - Day1昼 白糸の間（エロシーン中）。〇〇が値引きしないならお預けと揺らして焦らす。クラリスは涙目で欲しがりつつも50Gは譲らない。代わりに値段以外なら何でも言うことを聞くと頬ずりしてねだる
  - Day1昼 白糸の間（エロシーン中）。〇〇が『うんと言えばすぐありつける』と迫る。クラリスは言ったら負けと拒み、逆に〇〇の先走りを指摘して胸元のボタンを外し、レースの下着の胸を見せて『わたしもお預け』と挑発。50Gのまま全部を好きにするか、お預けし合うかと問う
  - Day1昼 白糸の間（エロシーン中）。〇〇が『採寸で興奮する変態だと言いふらす』と脅す。CHM対抗 18 vs クラリスINT 19で失敗（かすり）。クラリスは涙目で値引きは拒みつつ、残り2Gを免除。誰にも言わないで、自分の変態さは〇〇だけが知っていてと甘く懇願
  - Day1昼 白糸の間（エロシーン中）。〇〇がここに泊まっていいかと尋ねる。クラリスは2階は狭いと言いつつ、今夜もその先も泊まってよいと承諾。宿代はいらないと言い、夜は静かにさせないでと甘える
  - Day1昼 白糸の間（エロシーン中）。〇〇が宿泊を決め、しゃぶっていいと許す。クラリスがフェラ。先っぽから竿の半ばまで咥え、手でしごきつつスカート越しに自分を慰める。気持ちいいか、もっと奥か、口に出すかと尋ねる
  - Day1昼 白糸の間（エロシーン中）。〇〇がもっと奥までと煽る。クラリスが涙を零しながら喉の奥まで根元まで咥え込み、ゆっくり喉で扱く。スカート越しに自分も擦り、褒めてと見上げ、いっぱい出してとねだって再び咥える
  - Day1昼 白糸の間（エロシーン中）。〇〇が『君の口はオナホ』と言いかける。クラリスは意味を推し量り『殿方が気持ちよくなる道具』と理解して昂ぶり、手を膝に揃えて口を大きく開け舌を差し出し、頭をつかんで好きに使ってとねだる
  - Day1昼 白糸の間（エロシーン中）。〇〇がクラリスの頭を掴み、遠慮なく喉の奥まで突き込む。クラリスはスカートの中で自分を擦りながら喉を使われ、潮を吹いて絶頂。喉で搾りながら『全部のませて』と欲しがる（〇〇はまだ射精していない）
  - Day1昼 白糸の間（エロシーン中）。〇〇がオナホ扱いでイく変態、最高のオナホだと言う。クラリスは喜んで自分は変態だと認め、スカートをたくし上げて濡れた下着を見せ、おまんこもおなほにして奥で受け止めたいとねだる
  - Day1昼 白糸の間（エロシーン中）。〇〇がちゃんと言わなければ入れないと焦らす。クラリスは床に座り脚を開いて下着をずらし、自分で広げて見せ、おまんこに奥まで入れて中に注いでと淫らにおねだりする
  - Day1昼 白糸の間（エロシーン中）。〇〇がよく言えたと褒め、一気に根元まで挿入。奥に当たり、クラリスは入れられただけで潮を吹いて絶頂。首に腕、腰に脚を絡めてしがみつき、もっと動いてとねだる（〇〇はまだ射精していない）
  - Day1昼 白糸の間（エロシーン中）。〇〇が『雑魚まんこ』と罵り、抜いては一気に刺すを繰り返す。クラリスは自ら『ざこまんこです』と叫び、潮を吹いて3度目の絶頂。中に出してとねだる（〇〇はまだ射精していない）
  - Day1昼 白糸の間（エロシーン中）。〇〇が激しくピストン。クラリスはイきっぱなしで潮を吹き続け、呂律が回らず好きと繰り返し、キスをせがむ。ブラの肩紐が落ちる。中に全部出してと懇願（〇〇はまだ射精していない）
  - Day1昼 白糸の間（エロシーン中）。〇〇がクラリスの一番奥に中出し（二波）。クラリスは注がれながらまた潮を吹いて絶頂し、好きと繰り返してしがみつく。溢れた精液が床に垂れる。奥の結界は閉じたまま（話題に出ていない）
  - Day1昼 白糸の間（エロシーン中）。〇〇が引き抜き、クラリスのワレメから精液が溢れる。〇〇の命でクラリスがお掃除フェラ。舐め取るうちに再び硬くなり、二階の寝台へ行こうと誘う
  - Day1昼過ぎ 白糸の間（エロシーン中）。〇〇が二階で種付けすると告げる。クラリスが手を引いて階段を上がり2階の寝室へ。全裸になって寝台に仰向けになり、脚を開いて種でいっぱいにしてとねだる
  - Day1昼過ぎ 白糸の間2階（エロシーン中）。〇〇が寝バックで犯すと宣言。クラリスはうつ伏せでお尻を差し出し、閉じた脚のまま後ろから突かれる。窓の外に人の声が聞こえる中で声を上げ、また絶頂寸前（〇〇の二発目はまだ）
  - Day1昼過ぎ 白糸の間2階（エロシーン中）。〇〇が寝バックのまま奥に二発目を中出し。クラリスは同時に絶頂し潮を吹き、好きと叫ぶ。窓の外の通行人に声を聞かれる
  - Day1昼過ぎ 白糸の間2階（エロシーン中・余韻）。〇〇が外に聞かれた、明日どう仕事するのかとからかう。クラリスはどこの家か分からないはずと言い訳しつつ、明日はすまして働くが今日を思い出すと甘える。店の外では秘密にして、閉店後は〇〇だけのクラリスでいると約束を求める
  - Day1昼過ぎ 白糸の間2階（エロシーン中）。〇〇がメス奴隷になると宣言するかと問う。クラリスは向かい合って頬を包み、〇〇のメス奴隷になると宣言（お代だけはきっちり取ると添える）。今日初めて唇にキスし、『ご主人さま』と呼ぶ
  - Day1昼過ぎ 白糸の間2階（エロシーン中）。〇〇がメス奴隷のくせに口答えかと叱る。クラリスは謝りつつも代金は店の決まりで曲げられないと小さく繰り返し、両手首を頭上に差し出してお仕置きをねだる
  - Day1昼過ぎ 白糸の間2階（エロシーン中）。〇〇が一人で切り盛りしているなら値引きしても問題ないと迫る。クラリスは一人だからこそ決まりを曲げられない、好きになった人でも同じお代と答え、思わず『好き』と漏らす。代わりに〇〇の服は最優先で丁寧に仕立てると約束し、それでも口答えならお仕置きをとねだる
  - Day1昼過ぎ 白糸の間2階（エロシーン中）。〇〇が売上を尋ねる。クラリスは月6,000G前後、手取り2,000G強と答える。借金の肩代わりはしないが、食事・寝床・仕事の心当たりで支えると話す
  - Day1昼過ぎ 白糸の間2階（エロシーン中）。〇〇が金持ちで欲に飢えた相手をして稼ぐと言う。クラリスは寂しさを隠しつつ、未亡人ヴィオレッタ（34歳・蔦の屋敷）と裏娼館『蜜の味』の男娼の噂を教える。明日仕上がりの服で行けば目に留まると助言し、仕事の後は帰ってきてとねだる
  - Day1昼過ぎ 白糸の間2階（エロシーン中）。〇〇がヴィオレッタの年と資産を尋ねる。クラリスは見た目は若い美人で、ドレスに月300〜800Gを惜しまず払い、商会もかなり裕福と話す。金目当てには冷たいので、がっつかず相手から欲しくなるようにと助言し、少し拗ねる
  - Day1昼過ぎ 白糸の間2階（エロシーン中）。〇〇が『クラリスが紹介料、〇〇が相手代』の二段取りで稼ごうと提案。クラリスはそのままでは信用を失うと指摘し、〇〇を夜会の同伴者として紹介し、自分は〇〇の夜会服をヴィオレッタの注文として仕立てて稼ぐ案を出す
  - Day1昼過ぎ 白糸の間2階（エロシーン中）。〇〇が仕立て代に自分への金を上乗せしろと言う。クラリスはお客様の代金をごまかすことはできないと拒否。代わりに、初回は礼を求めず退屈させず、次を頼まれた時に借金を打ち明けると気前よく出すはずと助言。だめならお仕置きをとねだる
  - Day1夕 白糸の間2階。〇〇が『店のことになると使えない』と言い、準備を始めると告げる（エロシーン終了）。クラリスは身支度を整え、今夜冒険者の服を縫い上げると言う。明日午後にヴィオレッタへ夜会ドレスを届けるので荷物持ちで同行し紹介すると段取り。夜会は明後日夜、商人ギルドの館。夕飯を作ると申し出る
  - Day1夜 白糸の間2階。〇〇が休んで眠る。夜、クラリスが夕飯（豆と腸詰めの煮込み・黒パン）で起こす。冒険者の服は縫い上がり、仕上げは明朝。ヴィオレッタの執事から、夜会の同伴予定だった甥が熱で寝込んだと聞いたと伝える。休憩 d10=1、種別
    d10=6（耳寄りな情報）
  - Day1夜 白糸の間2階。〇〇が夕飯を食べて就寝。クラリスが背中に寄り添って眠る（Hなし）。Day2朝、クラリスが仕上がった冒険者の服を持ってきて、約束の裏地の色（薄紅・空色・葡萄色・濃紺）を選ばせる
  - Day2朝 白糸の間2階。〇〇が裏地はウケのいい色にと任せる。クラリスはヴィオレッタが紫好きだからと深い葡萄色を選び、その場で縫い付けて冒険者の服を渡す
  - Day2朝〜昼 白糸の間2階。〇〇が冒険者の服に着替えて休む（DEF+1）。休憩 d10=5（なし）。午後、よそゆきのクラリスがヴィオレッタのドレスの箱を持ってきて、荷物持ちを頼む
  - Day2昼過ぎ 〇〇がクラリスに『馬子にも衣装』と言い、ドレスの箱を抱えてヴィオレッタ邸へ。移動 d10=5（なし）、環境 d10=3（門脇で女中と庭師の戯れ）。老執事に案内され2階サロンでヴィオレッタと対面。ヴィオレッタは〇〇の肩の線に目を留め、誰かと尋ねる
  - Day2昼過ぎ ヴィオレッタ邸サロン。〇〇が名乗る。ヴィオレッタは短く応じ、ドレスの試着のためクラリスと奥の部屋へ。〇〇はサロンで待つよう言われ、老執事セバスチャンが紅茶を出す。サロンには亡夫らしい男との肖像画。執事は、初対面の男をサロンに残すのは珍しい、奥様は夜会の相手を失って沈んでいたと漏らす
  - Day2昼過ぎ ヴィオレッタ邸サロン。〇〇が執事に夜会のことを尋ねる。セバスチャンは、商人ギルド主催で今年はマルセル家の大広間、踊りと商談の場、独り身の女当主の奥様には商会目当ての男が群がる、同伴者は黙って控えることが肝要と説明。奥の部屋でヴィオレッタがドレスを気に入った様子
  - Day2昼過ぎ ヴィオレッタ邸サロン。〇〇が面と向かって褒めるのは恥ずかしいと言い、執事の心配事を尋ねる。セバスチャンは奥様の働きすぎと食の細さ、ドルトン商会の若旦那が縁組を迫り商隊と倉を狙っていて夜会にも来るはずだと打ち明ける。ヴィオレッタが続き部屋から『殿方の目で見てほしい』と〇〇を呼ぶ
  - Day2昼過ぎ ヴィオレッタ邸の衣装部屋。〇〇が入ると、夜会用の紫のドレスを着たヴィオレッタが姿見の前に立ち、殿方の目で正直に感想をと求める。執事との会話は聞こえていた様子
  - Day2昼過ぎ ヴィオレッタ邸の衣装部屋。〇〇がドレスを気品があると褒め、帳簿は分からないと苦笑。CHM 8+2d10(3,4)=15 vs 標準19で失敗。ヴィオレッタは褒め言葉はありふれていると受け取るが、帳簿を狙わない男だとは認める。ドレスの丈はこのままで明日夕方までに届けるようクラリスに指示し、夜会は早めに切り上げる、踊りを断るのに飽きたと漏らす
  - Day2昼過ぎ ヴィオレッタ邸の衣装部屋。〇〇が裏地を見せながら、踊りの申し込みの火の粉を払うと申し出る。CHM 8+2+2d10(4,6)=20 vs 標準19で成功。ヴィオレッタは葡萄色の裏地をクラリスの仕業と見抜いて笑い、ドルトン商会の若旦那も来ると告げたうえで、〇〇を夜会の同伴に『お試し』で起用。〇〇の夜会服（黒・裏は葡萄色）をクラリスに注文
