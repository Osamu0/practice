  campaign_lore:
    散策案内_Lilith_000:
      character_id: Lilith_000
      told: true
      day: 1
    NPC_クラリス:
      name: クラリス
      age: 26
      role: 仕立て工房『白糸の間』の女主人（西大通り界隈）
      appearance: 168cm・すらりとしたモデル体型・豊満な胸・亜麻色の髪をゆるい片編み・蜂蜜色の瞳・白襟の紺ワンピース
      personality: 清楚で丁寧。所作がきれい。仕事熱心で工房は繁盛している
      first_met: Day1朝 西大通りで〇〇にぶつかり、届け物のリボン箱を落とした
      status: その場の出会い。〇〇は後で店に顔を出すと約束
      stats:
        int: 7
        note: 一般人の判定用（火持ちではない）
      workshop: 西大通り、宿通りの角から二軒先。白い糸巻きの看板。窓辺にトルソー。朝から客が待つほど繁盛
      business: 『白糸の間』を一人で営んで約4年。客は西大通りの屋敷の奥方（夜会ドレス・婚礼衣装）と冒険者の外套・鎧下の繕い。忙しい時期だけ裏通りの刺繍上手な老婦人に飾りを外注。仕事は途切れず、手が足りず断ることもある。2階が住まい（一人暮らし）
      relationship: Day1、〇〇と肉体関係。白糸の間2階に〇〇が泊まることを承諾。閨では〇〇の『メス奴隷』と宣言し『ご主人さま』と呼ぶ（店では普段どおり。仕立て代は通常どおり取る）。店の外では秘密にしてほしいと頼んでいる
      promise: 〇〇の服はどんなに忙しくても最優先で、いちばん丁寧に仕立てる（代金は通常どおり）。開業時から『誰が相手でも同じお代』を自分の決まりにしている
      finances: 本人談：月の売上およそ6,000G（春秋は婚礼・夜会で多く、婚礼衣装1着で800〜900G。冬は繕い中心で少ない）。仕入れ・外注・消耗品・建物の借り賃を引いた手取りは月2,000G強。借金の肩代わりはしない方針。食事・寝床・客の噂話からの仕事の心当たりは提供する
      jealousy: 〇〇がほかの女の相手をして稼ぐと言った時、胸がちくりとしたが取り乱さず心当たりを教えた。仕事の後は必ず帰ってきてと頼み『全部上書きする』と言う
    エレナとの初対面:
      character_id: Elena_003
      day: 1
      summary: 〇〇の打ち身を治療。本音（傷に昂る性質）を〇〇に見抜かれ打ち明けた。オマケを断ったところ〇〇に『もう来ない』と言われ、気落ちしつつ『いつでも来て』と見送った
    NPC_ポーラ:
      name: ポーラ
      age: 20
      role: 中央広場の焼き菓子屋台『蜂蜜焼き』の売り子
      appearance: 赤いバンダナで髪をまとめる。細い腕
      first_met: Day1朝 屋台車が溝にはまり〇〇に手伝いを頼む
      status: 屋台車を押してもらい礼に蜂蜜焼きを渡した。また買いに来ればひとつオマケの約束
    白糸の間_構造:
      place_id: NOIR_CITY_WEST
      summary: 西大通り、宿通りへ折れる角から二軒目。上半分が硝子の扉に鈴。1F表：窓辺にトルソー3体、壁一面の反物棚。奥に大きな作業台。紺の厚いカーテンで仕切った試着の間。反物棚の陰に2階への細い木の階段。2F：斜め天井の屋根裏風の寝室。白い寝台ひとつ、生成りのカーテンの小窓、衣桁、針箱の小机、窓辺に野の花の花瓶
      owner: クラリス
    注文_白糸の間_冒険者の服:
      item: 冒険者の服（仕立て・〇〇の寸法、股まわりにゆとり）
      price_g: 50
      paid_g: 48
      due_g: 0
      waived_g: 2
      ready: Day2朝
      pickup: 白糸の間
      stats: DEF+1／重量1
      extra: 裏地の色を受取時に選べる（追加料金なし）
      status: Day2朝に受け渡し済み（裏地は深い葡萄色。ヴィオレッタの好きな色としてクラリスが選んだ）
    クラリス宅への宿泊:
      summary: Day1昼、〇〇が白糸の間に泊まりたいと頼み、クラリスは今夜もその先も泊まってよいと承諾。2階は寝台ひとつの狭い住まい。宿代は取らない（店の商いではないため）
      status: Day1夜に初めて泊まった（宿代なし）
    NPC_ヴィオレッタ:
      name: ヴィオレッタ
      age: 34
      role: 西大通りの一番奥、蔦の絡む屋敷の未亡人。3年前に亡くした夫の交易商会を継ぎ裕福
      notes: 白糸の間の常連。黒髪を高く結い上げた色白の美人で見た目は若い。夜会ドレスを月1〜2着（1着300〜400G）、値切らず多めに払う。商会は住み込み使用人・荷馬車多数で裕福。採寸のたびに若い男を恋しがるそぶり。金目当ての男には冷たく、露骨に言い寄った冒険者に門前で水を浴びせさせたことがある（クラリス談・未対面）
      status: Day2に初対面。葡萄色の裏地に気づき、クラリスの仕業と見抜いて初めて笑う。〇〇を夜会の同伴に試しに起用
      soiree_escort: Day3夜会の同伴を頼んでいた親戚の甥がDay1から熱で寝込み、同伴者が空いている（執事がDay1夕に白糸の間でこぼした話）。ヴィオレッタは機嫌が悪い
      appearance: 艶やかな黒髪を高く結い上げ、細く長い首、抜けるように白い肌、切れ長の目。豊かな胸と細い腰。深い紫の部屋着に大粒の紫水晶の首飾り
      background: 夫の死の翌月から自ら帳場に座り商会を切り盛り。夜遅くまで帳簿、朝は早い。食が細い。笑い方をまだ思い出せていない（執事談）
    計画_ヴィオレッタの夜会同伴:
      proposed_by: クラリス（〇〇の『紹介料と相手代の二段取り』案を修正）
      plan: 〇〇を夜会の同伴者としてヴィオレッタに紹介。同伴の礼はヴィオレッタから〇〇へ。クラリスは紹介料を取らず、〇〇の夜会服をヴィオレッタの注文として仕立て代金を得る。夜会後のことは二人次第
      constraints: クラリスは代金の上乗せ・ごまかしを拒否
      advice: 初回の夜会では礼の話をせず退屈させない。帰りの馬車で次を頼まれたら、少し困った顔で借金があると打ち明けると気前よく出してくれるはず（クラリス談）
      status: Day2、ヴィオレッタが〇〇をDay3夜会の同伴に『お試し』で起用。夜の鐘の前に屋敷へ。〇〇の夜会服（上は黒・裏は葡萄色）をヴィオレッタの注文としてクラリスがDay3夕方までに仕立てる（代金はヴィオレッタ持ち）。同伴の礼は未定
    行事_商人ギルド春の夜会:
      day: 3
      date: 箱庭暦1年1月3日（水）夜の鐘から
      place: 毛織物商マルセル家の屋敷の大広間（商人ギルド主催・会場は大商家の持ち回り。ギルドの窓口自体は銀の天秤亭の相談区画）
      note: 各商家の当主と連れが出席。楽団、輪舞と円舞、葡萄酒。実態は商談の場。独り身の女当主ヴィオレッタには商会目当ての男が群がる。同伴者は当主の隣で控え、話を遮らないことが肝要（執事セバスチャン談）。Day1にクラリスが言った『商人ギルドの館』はこの会場のこと
    ヴィオレッタ邸_構造:
      place_id: NOIR_CITY_WEST
      summary: 西大通りの一番奥。蔦に覆われた石塀と鉄の門、門番あり。紫の硝子窓が並ぶ三階建て。銀髪の老執事。1階から磨かれた階段、廊下に紫の花の絵と紫硝子の花瓶。2階にサロン（窓辺に長椅子、香水の匂い）
    NPC_セバスチャン:
      name: セバスチャン
      role: ヴィオレッタ邸の銀髪の老執事
      notes: Day2、〇〇にお茶を出し、ヴィオレッタが夜会の相手を失って窓の外ばかり見ていたと独り言のように漏らす
    NPC_ドルトン商会の若旦那:
      name: ドルトン商会の若旦那（名前未確認）
      role: 他商会の跡取り
      notes: ヴィオレッタにしきりに縁組の使いをよこす。狙いはヴィオレッタの商隊と倉（執事談）。Day3の夜会にも来て、連れのいないヴィオレッタの隣に真っ先に来るはず
      status: 未対面
