session_log:
  previous: ''
  entries:
  - Day1朝 ぬれねずみ亭を出て銀の天秤亭へ向かう途中、西大通りで調香師セレナ（22歳・その場の出会い）とぶつかる。婚約者とギルド前で待ち合わせ中。移動イベント d10=1、種別 d10=5（出会い）
  - Day1朝 西大通り。〇〇が骨折したふりをして治療費を匂わせる。CHM対抗 22 vs セレナINT 21で成功、セレナは信じて治療代50Gを差し出そうとしている（未受領）
  - Day1朝 〇〇が50Gでは足りないと詰め寄る。セレナは手持ちが銀貨5枚(50G)だけと明かし、店の商品『白百合の香油』(30G相当)を上乗せして差し出す。婚約者の冒険者ガルドが苛立って近づいてくる
  - Day1朝 〇〇はセレナの治療代50Gをしれっと受け取り、ガルドに『話し合いをしていただけ』と言う。香油は受け取っていない
  - Day1朝 〇〇がガルドを言葉で圧倒（CHM対抗 30 vs 12）。ガルドは捨て台詞を残してギルドへ。セレナは礼を言い、店に来てほしいと告げて去る
  - Day1朝 白百合香房へ向かう路地口で、道具屋のミアと偶然会う。ミアはガラス瓶の納品帰りで、ガルドとの一件を見ていた。移動イベント d10=1、種別 d10=10
  - Day1朝 〇〇がミアに名乗り、さっきの件の口止めと脅し混じりの念押し。ミアは面白がって承諾し、『その代わり稼いだらうちで使って』と約束させて広場へ戻る
  - Day1朝 〇〇が白百合香房を訪ねる。セレナは一人で店を開ける準備中。環境 d10=7（なし）
  - Day1朝 白百合香房。〇〇が『医者に診せて治ったが借金になった』と嘘をつく。CHM対抗 20 vs セレナINT 16で成功。セレナは自分のせいで借金を負わせたと思い込み、何か償えることはないかと申し出る
  - Day1朝 白百合香房。〇〇が店の客入りを尋ねる。セレナは繁盛していると話しつつ、売上をガルドの立て替えに回していることを漏らす
  - Day1朝 白百合香房。〇〇が遠くから来たばかりだと明かし、この世界のことを尋ねる。セレナがノワールの街と暮らし方、男女のことを教える
  - Day1朝 白百合香房。〇〇が月の売上を尋ね、セレナは戸惑いつつ数字を打ち明ける
  - Day1朝 白百合香房。〇〇がガルドとの関係を尋ね、セレナが馴れ初めと婚約の経緯を話す
  - Day1朝 白百合香房。〇〇が『まだ愛しているのか』と問う。セレナは結婚ではなく婚約だと正し、恩と習慣で一緒にいるだけかもしれないと迷いを口にする
  - Day1朝 〇〇がセレナに『少し待っていてくれ』と告げて白百合香房を出て、中央広場のミアの店へ。移動 d10=4（なし）、環境 d10=2（広場で吟遊詩人と踊り子）
  - Day1昼前 ミアの店。〇〇が奥で話したいと頼む。ミアは私室には入れず、店先に休憩中の札を掛けて会計台で二人きりで聞くことにする
  - Day1昼前 ミアの店。〇〇がタダで情報を引き出そうとする。CHM対抗 18 vs ミア 28で失敗。ミアはセレナとは友達だと言い返し、さわりだけ教えて、本題は情報料30Gと持ちかける
  - Day1昼前 ミアの店。〇〇が情報料30Gを払う（所持金50G→20G）。ミアからガルドの賭場通い・借金・白百合香房を担保にする話を聞く。〇〇が『調子に乗るな』と脅し、ミアは怯えつつも商売人の顔を崩さない
  - Day1昼前 ミアの店。〇〇がミアに『俺とのビジネスの話をしたい』と切り出す。ミアは食いつき、条件次第と身構える
  - Day1昼前 ミアの店。〇〇がミアに計画を明かす：ガルドを嵌めてセレナから遠ざけ、白百合香房の売上の一部を自分の借金返済に回させたい。ミアは仮病を見抜いた上で話に乗りかけ、自分の取り分とセレナを潰さないことを条件に出す
  - Day1昼前 ミアの店。〇〇がミアに条件を示す（自分の取り分は月1,000G、香房の売上を伸ばし、香房からミアの店へ客を回す）。ミアは瓶の卸の独占と素材の優先持ち込みを条件に、口約束で手を組む
  - Day1昼前 ミアの店。〇〇がミアの条件を呑んで手を組む。ミアがガルドを嵌める案を三つ出す（偽の権利書の罠／賭場での勝負／バルトへの密告）
  - Day1昼前 ミアの店。〇〇は、セレナと良い関係になり幸せになってほしいと言い、権利書の罠で衛兵に押さえさせる案を選ぶ。ミアがバルトのことを説明し、この策にはセレナ本人の協力が要ると話す
  - Day1昼前 ミアの店。〇〇がセレナには内緒で偽の権利書を作るため紙とペンを求める。ミアは権利書は役所の透かしと封蝋入りで紙とペンでは作れないと説明し、偽造の片棒は担がないと断る
  - Day1昼 ミアの店を出てぬれねずみ亭へ向かう途中、宿通りへ折れる角で、荷車から落ちたらしい小さな革袋を見つける。移動イベント d10=1、種別 d10=6
  - Day1昼 落とし物の革袋は拾わずに通り過ぎ、ぬれねずみ亭へ戻る。酒場でリリスが帳簿をつけている。環境 d10=5（なし）
  - Day1昼 ぬれねずみ亭から銀の天秤亭へ。移動 d10=5（なし）、環境 d10=3（掲示板前で女冒険者が男をからかう）。受付のミルカに迎えられる
  - Day1昼 銀の天秤亭の受付。ミルカが登録札のない〇〇に用件を尋ね、登録の手順を案内。今朝の西大通りの揉め事の噂と、ガルドが少し前にギルドを出て東の衛兵通りの方へ向かったことを伝える
  - Day1昼 銀の天秤亭の受付。〇〇がガルドの評判と話し相手を尋ねる。ミルカは依頼記録は明かせないとしつつ、広間で誰でも見られたことだけを話す：ガルドはD級四年目で最近は報告が少ない。記入卓で斧使いの仲間ドーンと、甘い葉巻の匂いをさせた灰色外套の細い男と話し込み、男の出した書き付けを覗き込んでいた
  - Day1昼 銀の天秤亭の受付。〇〇は理由を答えずに灰色外套の男のことを重ねて尋ねる。ミルカは答えなかったことを覚えておくと言いつつ、男についてさらに話す：この一月で三度目、開店直後に記入卓の奥の柱の陰に座る、依頼は見ない。前の二度はE級の若い冒険者と話し、その二人はその後来なくなった。ガルドは男を『シラス』と呼んだ。書き付けの端に赤い封蝋（役所の紫ではない）。ミルカの視線が記入卓足元の籠へ一瞬流れる
  - Day1昼 銀の天秤亭。〇〇がミルカの目の泳ぎを指摘し、記入卓の籠を調べる。ミルカは否定しつつ止めない。INT判定 9+3+4=16 vs 標準19で失敗：手間取り茶殻が染みたが、ガルドの書き損じを見つける。『セレナ・』の署名を何度も練習した跡と、『……月末の締めの前に　権利書は……が持ち出す』『……日の夜　銀蛇亭の裏へ』の走り書き。日付と持ち出す者の名は茶に溶けて読めない。紙は〇〇が手に持っている（まだ所持品にしていない）
  - Day1昼 銀の天秤亭の記入卓。〇〇が権利書の偽造かとミルカに罪の重さを尋ねる。ミルカは受付から出てきて、権利書は本物で、これはセレナの署名をまねて担保の証文を作る練習だと正す。罰の重さと、書き損じだけでは捕まえられず、署名済みの証文か持ち出しの現場を押さえる必要があると説明。届け出は東の衛兵通りの詰め所。紙は拾った者のもの、自分は何も見ていないと言う
  - Day1昼 銀の天秤亭の記入卓。〇〇が『盗るしかないか、セレナを守るためにも』と漏らす。ミルカは一度冷え、聞き間違いにしておくと流したうえで、先に盗れば牢に入るのは〇〇だと忠告。持ち主のセレナが自分の手で預けるなら盗みではなく預かり（役所や信用できる人に預ける人もいる）と案内し、持ち出しの現場を押さえる道と走り書きの『銀蛇亭の裏へ』にも触れて、言い過ぎたと赤くなる。広間にはほかに壁炉の前で居眠りする年配の冒険者だけ
  - Day1昼 銀の天秤亭。〇〇が『意外と乗り気だね』とからかい、もう少し相談に乗ってほしいと頼む。ミルカは否定しつつ受付に席外しの札を立て、〇〇を北西の相談区画へ案内して二人きりに。分かっていること三つと分からないこと（日付・持ち出す者）を手帳で整理し、手を二つ考えたと言う。条件として、全部終わったら一部始終を細かく自分に話すことを求める（返事はまだ）
  - Day1昼 銀の天秤亭の相談区画。〇〇が『報告書に必要ってことにしてあげる』とミルカの条件を呑む。ミルカが二つの手を示す：①権利書をいつもの場所に置いたままセレナにだけ事情を話し、持ち出した者を尾行して銀蛇亭の裏の受け渡しを衛兵隊に押さえさせる（証拠はそろうが日付不明だと毎晩見張り、本物が一度店外へ出る）②先に日付と持ち出す者を割り出す。当てはドーン（夕方一人で納品口に素材を売りに来る、嘘のつけない人、今朝顔をしかめていた）と、セレナの店の月末の締めの日。どちらもセレナの協力が要る
  - Day1昼 銀の天秤亭。〇〇がミルカに、夕方ドーンが来たら知らせることと、仲間にできそうなネタを頼む。ミルカは前者を承り、後者は弱みを探るのは断るが広間で見聞きできる範囲でドーンの気にすること・嫌がることを夕方までに思い出しておくと答える。〇〇は白百合香房へ。移動
    d10=4（なし）、環境 d10=6（なし）。帰る『蜜の味』の娘とすれ違い、待っていたセレナに迎えられる
  - Day1昼 白百合香房の売り場。〇〇は詳しい話の前に、ガルドが捕まったらどう思うかとセレナに尋ねる。セレナは『かわいそう』と思う一方で、同じくらいほっとしてしまうと打ち明け、それを恥じる。本当に悪いことをしているなら知らないふりはしたくない、店のことならなおさらだと言い、今日見てきたことを教えてほしいと頼む
  - Day1昼 白百合香房。セレナが扉に『ただいま調合中』の札を掛ける。〇〇がガルドの書き損じを見せる。セレナは走り書きをガルドの字と断定し、自分の字に似せた署名の練習だと気づいて震える。締めは毎月三十日の夜とガルドも知っている。先々週ガルドに聞かれて権利書の場所（2F寝室の衣装箱の底）を教えてしまったこと、ガルドが裏口の鍵を持っていることを打ち明け、礼を言って『私はどうすればいいですか』と尋ねる。紙は〇〇に返された
  - Day1昼 白百合香房。〇〇が権利書を今のうちに預けてほしい、幸せになってほしいと頼む。CHM対抗 12+2(状況：裏切りの証拠を持ってきた本人)+6+8=28 vs セレナINT 9+3+6=18で成功。セレナは2Fの衣装箱から権利書を出して〇〇に預け、自分の署名入りの預かり証を書いて添える。衣装箱は空のまま蓋を閉めておき、ガルドに気づかれないようにすると言う。ガルドの書き損じも〇〇が持つ
  - Day1昼過ぎ 白百合香房。〇〇が『無事に終わったら借金の返済について話そう』と言い、セレナは必ず話すと約束して見送る（お帰りを待っていますと）。〇〇は銀の天秤亭へ。移動イベント d10=2、種別 d10=8（店・噂話）：西大通りの布屋の軒先で、女主人と奥さんが、ミルカが昼に席外しの札を立てて男を奥の小部屋へ連れていき顔を真っ赤にしていたと噂している。話はすぐ春物の反物へ移る
  - Day1昼過ぎ 噂話を通り過ぎて銀の天秤亭へ（見送り後の到着）。ミルカの受付。ドーンはまだ（いつも夕方の鐘の後）。ミルカが思い出したドーンのことを話す：酒も賭けもしない（父が骰子で家をなくした）、一年前ダンジョン三階で大怪我をしガルドに背負われて帰って以来『借りがある』と組み続けている、納品後は中央広場で焼き菓子を買って西南の住居路地へ帰る（妹と二人暮らし）、先月仲間募集欄を長く眺めていた。ミルカは布屋のおかみさんに覗かれていた気がすると気にする
  - Day1昼過ぎ 銀の天秤亭の受付。〇〇がミルカに『春が来た』と噂になっていたと伝え、ミルカは真っ赤になって業務だと否定する。〇〇がセレナから預かった権利書と預かり証を見せる。ミルカは本物と確認、預かり証も有効と認め、広間では出さないよう言う。空の衣装箱を開けたガルドが焦ってセレナに直接詰め寄る（裏口の鍵で夜に）おそれを指摘し、セレナを一人にしないことと、箱を開けた時に何が起きるかを先に決めておくことを勧める
  - Day1昼過ぎ 銀の天秤亭の受付。〇〇が衛兵に張ってもらい暴行の現場を押さえる案を出す。ミルカは衛兵に張ってもらうのは賛成（シルヴィア隊長は筋の通った話なら動く、悪人を追い詰めるのが好きすぎるくらい）だが、セレナが殴られるのを待つことになると暴行待ちには反対。代わりに、夜に裏口から入って衣装箱を開けた時点で押さえる案を出す。ガルドは鍵を渡されているため、先にセレナから衛兵隊へ『もう家に入れたくない』と届けておけば侵入として扱えると指摘。残る問題は日付で、ドーンに当たる必要があると言う。昼の終わりの鐘が鳴る
  - Day1昼過ぎ〜夕 銀の天秤亭の記入卓でドーンを待つ。待つ間の出来事 d10=10（なし）。夕方の鐘のあと、ドーンが一人で来て東奥の納品口で灰色の毛皮と牙を売る。ミルカが目配せで知らせる。ドーンは疲れた顔で、眉間に深い縦皺
  - Day1夕 銀の天秤亭。〇〇の合図でミルカがドーンを呼び止め、先月の仲間募集の件として『組む相手を探している方』と〇〇を紹介する。ドーンは登録札がないことに気づき、ガルドを通さず自分に話が来たことをいぶかしむ（『ガルドとは組まねえのか』）。ミルカが相談区画を勧めて受付に戻り、ドーンは『少しなら』と脇扉へ向かう
  - Day1夕 銀の天秤亭の相談区画でドーンと二人。〇〇が仲間募集をしているのかと尋ねる。ドーンは掲示壁を見ていただけで札は出していない、出す気もないと答える。ガルドと組んで四年、一年前に三階で腹を裂かれガルドに背負われて助かった恩があると語る。一方で『最近のあいつは昔のあいつじゃねえ、組むならガルドはやめとけ』と漏らし、〇〇に何ができるのかと問う
  - Day1夕 相談区画。〇〇が『これからだから何でもできるようになれる』と答え、昔のガルドとの違いを尋ねる。ドーンは、四年前のガルドはまっとうな剣士で貯金もし、セレナと婚約した時は酒をおごったと語る。半年ほど前から銀蛇亭に出入りし、依頼に出ず前借りの話ばかり、負けた日はセレナに当たると話す。父の件にも触れ、最近は灰色外套の葉巻臭い男とつるみ、その男が来るとガルドの目つきが変わると言う。続きは『ガルドの仲間として言えねえ』と止め、〇〇がなぜそこまで聞くのかと問い返す
  - Day1夕 相談区画。〇〇がセレナから相談を受けていて、もう耐えきれないそうだ、何か起こってからでは遅い、仲間を庇った結果がそうなったら悲惨だとドーンを説く。CHM対抗 12+2(状況：ドーン自身が誰かに話したがっている・父の件)+3+5=22
    vs ドーンINT 7+2+8=17で成功。ドーンが計画を明かす：今朝シラスが出した証文の下書き『白百合香房の権利を借金三千Gのカタとして銀蛇亭のバルトに渡す』、セレナの署名欄つき。決行は月の二十九日の夜（締めの前の晩、セレナが眠った後）。ガルドが合鍵で裏口から入り2Fから権利書を持ち出し、シラスが証文にセレナの名を書き、夜のうちに銀蛇亭の裏でバルトに渡す。ドーンは路地の見張り役、分け前二百G、返事は三日のうちに。まだ返事はしていない。ドーンは『俺に何をしろって言うんだ』と問う
  - Day1夕 相談区画。〇〇が『あいつは本当に仲間か、人も場所も金としか見ていない』とドーンに迫る。ドーンは三年前ガルドがセレナを助けた場に自分もいたと語りつつ、今のガルドは仲間ではない、父と同じだと認める。見張りを断れば別の見張りや日の変更で動きが分からなくなるため、乗ったふりをして当日まで動きを探る案を自分から出す。条件として、セレナが傷つかない方法だと約束しろと〇〇に求める
