  campaign_lore:
    散策案内_Lilith_000:
      character_id: Lilith_000
      told: true
      day: 1
    通貨_銀貨:
      fact: ノワールで流通する銀貨1枚は10G
      source: Day1 セレナとの会話
    人物_セレナ:
      name: セレナ
      age: 22
      role: 調香師。西大通り脇の路地を入ってすぐの香水店『白百合香房』の店主
      appearance: 長身でモデル体型、胸は大きめ。亜麻色の髪を結い上げ、白い詰め襟のワンピース。灰色がかった青い瞳
      personality: 清楚で礼儀正しく、取り乱さない。責任感が強い。押しの強い相手に弱く、内心では強く出られることに少し胸を高鳴らせる
      relation: Day1朝、〇〇とぶつかり治療代50Gを渡した。婚約者ガルドに人前で叱られることが多い様子
      status: 確定した事実
    人物_ガルド:
      name: ガルド
      age: 29
      role: D級冒険者。革鎧に長剣。セレナの婚約者
      personality: 短気で嫉妬深い。人前でもセレナを叱りつける。酒好きで見栄っ張り。機嫌のいい時だけ優しい
      history: 三年前、街道で野盗に絡まれたセレナを助けたのが出会い。二年前に婚約。結婚は『大きな仕事を取ってから』と先延ばしが続いている。セレナの売上から毎月二千G近くを立て替えさせている
      relation: Day1朝、西大通りで〇〇に気圧されて引き下がり、セレナを置いて銀の天秤亭へ入った
      status: 確定した事実（経緯はセレナの話）
    出会い_Mia_001:
      character_id: Mia_001
      met_day: 1
      knows_name: true
      fact: Day1朝、白百合香房への路地口で会う。ガルドとの一件と仮病を見ていたが、〇〇に口止めされて内緒にすると約束した
      status: 確定した事実
    場所_白百合香房:
      place_id: LORE_SHIRAYURI_KOUBOU
      parent: NOIR_CITY_WEST
      name: 白百合香房
      owner: セレナ
      position: 西大通りから路地を一本入って角を曲がった先
      structure: 石造り二階建ての小さな店。1F南側が売り場（入口の扉に鈴、窓辺の棚、奥にカウンター）、カウンター裏の暖簾の奥が調香室。調香室の奥に裏口と2Fへの階段。2Fはセレナの住まい
      rooms:
        LORE_SHIRAYURI_KOUBOU_SHOP: 売り場
        LORE_SHIRAYURI_KOUBOU_WORKROOM: 調香室
        LORE_SHIRAYURI_KOUBOU_UPSTAIRS: 2Fの住まい（私室）
      status: 確定した事実
    白百合香房_客層:
      fact: 昼過ぎから夕方が混む。客は『蜜の味』の娼婦、商家の奥方、贈り物を探す冒険者。調合の注文は十日先まで埋まっていて繁盛している。売上の多くを婚約者ガルドの装備代や酒代の立て替えに回していて、店の金を月末まで動かせない
      status: セレナ本人の話
    白百合香房_売上:
      fact: 売上は月におよそ8,000G。材料と瓶代、家賃を引いて手元に残るのは3,000G前後。そのうち2,000G近くをガルドの立て替えに回している。店の金は月末の締めまで動かさない決まり。締めは毎月三十日の夜で、セレナが店の金を数えて帳面を閉じる（ガルドも知っている）
      status: セレナ本人の話
    ミアの情報_ガルド:
      fact: ガルドは昼過ぎに南東の歓楽通りの賭場『銀蛇亭』に通い、負けが込んで金貸しのバルトに約3,000Gの借りがある。返済の当てとして、セレナの店『白百合香房』の権利を担保に入れる話をバルトとしているのをミアが聞いた。歓楽通りの娼婦にも馴染みがいるらしい
      source: ミアの目撃と立ち聞き。Day1に〇〇が30Gで購入
      status: ミアの情報（未確認の部分あり）
    密約_ミアとガルド排除:
      parties:
      - 〇〇
      - Mia_001
      agreed_in_principle: true
      plan: ガルドを嵌めてセレナの前から消す。その後、白百合香房の客を増やし、セレナから〇〇の借金返済に月1,000Gを回してもらう（セレナ本人の同意が前提）。セレナの客をミアの店へ紹介する
      mia_terms: 白百合香房の瓶の卸をミアの店が独占する／香房の会計台にミアの店の案内札を置く。手間賃は取らない代わりに、〇〇が冒険で得た素材をまずミアの店に持ち込む
      status: 〇〇がミアの3条件を呑み、口約束で手を組んだ。セレナの同意とガルドの件はまだ
    人物_バルト:
      name: バルト
      age: 45
      role: 南東の歓楽通りで賭場『銀蛇亭』の裏手に事務所を構える金貸し
      appearance: 小太りで、指に太い金の指輪を三つ。いつも甘い葉巻の匂いをさせている
      personality: 笑顔は崩さないが、取り立ては手下に容赦なくやらせる。表向きは商人で、衛兵の前では手を汚さない
      relation: ガルドに約3,000G貸している。白百合香房の権利書を借金のカタに欲しがっている
      status: ミアの話
    ノワールの権利書:
      fact: ノワールの店の権利書は役所の透かし入り羊皮紙に書かれ、街の代表ロザリアの封蝋と登録番号が押されている。紙とペンだけでは似せられない。本物と照らし合わせれば役所ですぐ見分けがつく
      status: ミアの説明
    ガルド_Day1昼の動き:
      fact: Day1朝に銀の天秤亭へ入ったガルドは、昼前まで記入卓で仲間と話し込み、昼に入る少し前にギルドを出て東の衛兵通りの方へ向かった
      source: Day1昼 ミルカの話
      status: ミルカの目撃
    ガルド_ギルドでの評判:
      fact: ガルドはD級に上がって四年目。腕は悪くないが、ここ半年は依頼の報告が月に一、二件まで減っている。報酬の前借りを頼んでミルカに断られたことがある。いつも組むのは斧使いの冒険者ドーン（D級・30代の大男、無口）
      source: Day1昼 ミルカの話（広間で知れ渡っている範囲）
      status: ミルカの話
    灰色外套の男:
      fact: 銀の天秤亭の記入卓に現れる冒険者ではない細身の男。灰色の外套、指に細い銀の蛇の指輪、甘い葉巻の匂い。この一月で三度来ており、いつも開いてすぐ記入卓の一番奥の柱の陰の席に座る。依頼は見ず、茶を一杯頼んで銀貨で払い釣りを受け取らない。前の二度はE級の若い冒険者と話し、その二人はその後ギルドに来なくなった。Day1朝はガルド・ドーンと話し込み、端に赤い封蝋の付いた書き付けを見せ、三人で東の衛兵通りの方へ出た。ガルドは男を『シラス』と呼んだ
      source: Day1昼 ミルカの目撃
      status: ミルカの目撃。名前『シラス』が本名かは不明。身元未確認（バルトの手下の可能性）
    記入卓の籠_ガルドの書き損じ:
      fact: Day1朝、シラスが書き付けをしまった後、三人で席を立つ前に、ガルドが記入卓で書き損じを丸めて足元の籠へ捨てた。Day1昼に〇〇が拾って広げた。厚手の紙で、『セレナ・』の署名を何度も書いては消して練習した跡があり、最後の一つはセレナの丸みのある筆跡にかなり近い。下に走り書き二行『……月末の締めの前に　権利書は……が持ち出す』『……日の夜　銀蛇亭の裏へ』。日付と持ち出す者の名は茶の染みで読めない
      place_id: GUILD_SILVER_SCALES
      room_id: GUILD_SILVER_SCALES_WRITING
      status: 確定した事実（紙は〇〇が手に持っている。ミルカも内容を見た）
    ノワールの法_証文偽造と持ち出し:
      fact: 他人の名で証文を作る（署名の偽造）は重罪。衛兵隊に捕まると詰め所の牢で裁きを待ち、役所の裁きで牢に一月以上、だまし取ろうとした額の倍を相手に弁済。額が大きい・店や家を狙う等の悪質なものは街から追放もある。権利書を本人に黙って持ち出すのは盗みで牢。冒険者の犯行ならギルドは登録を抹消し、ランクと実績も消える。署名の練習の書き損じだけでは捕縛できず、署名済みの証文か持ち出しの現場の証拠が要る。届け出は東の衛兵通りの衛兵詰め所
      source: Day1昼 ミルカの説明
      status: 確定した事実（ノワールの法）
    ノワールの法_権利書の預かり:
      fact: 権利書の持ち主が自分の手で誰かに預けるのは盗みではなく預かり。役所に預ける人も、信用できる人に預ける人もいる
      source: Day1昼 ミルカの説明
      status: 確定した事実（ノワールの法と慣習）
    ミルカ_〇〇の目的:
      fact: ミルカは〇〇がセレナを守るためにガルドの件を探っていると受け取った。『盗る』発言は聞き間違いとして流した。Day1昼過ぎ、〇〇が預かった権利書と預かり証を見て本物・有効と確認した
      source: Day1昼〜昼過ぎ
      status: 確定した事実
    ミルカの相談の条件:
      fact: ミルカはガルドの件の相談に乗る条件として、全部終わったら一部始終を細かいところまで自分に話すことを求めた
      source: Day1昼 相談区画
      status: 〇〇が承諾（Day1昼）。件が終わったら一部始終を細かくミルカに話す約束
    人物_ドーン:
      name: ドーン
      age: 34
      role: D級冒険者。斧使い。ガルドといつも組んでいる
      appearance: 扉の枠に頭がつかえそうな大男。短く刈った栗色の髪、日焼けした太い首。刃の欠けた戦斧を背負う。革鎧の胸当てに古い大きな裂け目を縫い直した跡（一年前の大怪我の名残と思われる）
      personality: 無口だが嘘のつけない人。大事にしているものを雑に扱われると口を閉ざす（ミルカの見立て）
      habit: 夕方の鐘の後、一人で銀の天秤亭の納品口へ素材を売りに来る。納品後は中央広場で焼き菓子を一袋買い、西南の住居路地へ帰る
      background: 酒も賭けもしない（父親が骰子で家をなくした、と酒場で話していた）。一年ほど前ダンジョン三階で大怪我をし、ガルドに背負われて帰った。それ以来『あいつには借りがある』と言い、組み続けている。妹と二人暮らし。先月、掲示壁の仲間募集欄を長く眺めていた
      relation: Day1朝、シラスの書き付けを覗き込むとき一人だけ顔をしかめていた。ガルドの銀蛇亭通いをよく思っていない様子（ミルカの見立て）
      status: ミルカの話とDay1夕の本人の話。〇〇に計画を打ち明け、協力を求められる立場
    ミルカの二つの手:
      fact: ①見張って押さえる：権利書を置いたままセレナにだけ話し、持ち出した者を尾行して銀蛇亭の裏で衛兵隊に押さえさせる。②先に日付と持ち出す者を割り出す：夕方に納品口へ来るドーンに当たる／セレナに店の月末の締めの日を聞く。どちらもセレナの協力が要る。ミルカは夕方ドーンが来たら気づく程度は手伝える
      source: Day1昼 ミルカの提案
      status: ミルカの提案
    ミルカへの頼み_ドーン:
      fact: Day1昼、〇〇はミルカに、夕方ドーンが納品口に来たら知らせることと、ドーンを仲間にできそうな話を頼んだ。ミルカは知らせることを承諾。弱みを探るのは断ったが、広間で見聞きできる範囲でドーンの気にすること・嫌がることを夕方までに思い出しておくと約束
      source: Day1昼
      status: ミルカの約束
    セレナの気持ち_ガルド:
      fact: ガルドが捕まったらと聞かれ、恩人として『かわいそう』と思う一方、叱られず、店の金を月末に数えず、機嫌をうかがわずに済むと思うと同じくらいほっとしてしまうと打ち明けた。それを恥じつつ、ガルドが本当に悪事をしているなら知らないふりはしたくない、店のことならなおさらだと言った。〇〇の前だと素直に口が動いてしまうと内心で感じている
      source: Day1昼 セレナ本人の言葉
      status: セレナ本人の話
    白百合香房_権利書と鍵:
      fact: 権利書は元々2Fの寝室の衣装箱の底にしまってあった（Day1昼から〇〇が預かり、箱は空）。先々週ガルドに『ちゃんとしまってあるのか』と聞かれ、セレナはその場所を教えてしまった。ガルドは裏口の鍵を持っている
      place_id: LORE_SHIRAYURI_KOUBOU
      room_id: LORE_SHIRAYURI_KOUBOU_UPSTAIRS
      source: Day1昼 セレナ本人の話
      status: 確定した事実
    ガルドの書き損じ_筆跡:
      fact: セレナが書き損じの走り書きをガルドの字と確認した（右肩上がりで払いが乱暴に跳ねる癖。毎月の立て替えの書付で見慣れている）。並んだ署名はセレナの字に似せる練習
      source: Day1昼 セレナの確認
      status: 確定した事実
    白百合香房_権利書の預かり:
      fact: Day1昼、セレナは自分の意思で白百合香房の権利書を〇〇に預け、署名入りの預かり証を渡した。2F寝室の衣装箱は空のまま蓋を閉めてそのままにしてある（ガルドに気づかれないため）
      place_id: LORE_SHIRAYURI_KOUBOU
      room_id: LORE_SHIRAYURI_KOUBOU_UPSTAIRS
      status: 確定した事実
    人物_セレナ_能力:
      fact: セレナのINTは9（Day1の対抗判定の記録から）
      status: GM参照用
    セレナの気持ち_〇〇:
      fact: 三年一緒にいたガルドより今朝会った〇〇のほうが信じられると口にした。『幸せになってほしい』と言われたのは久しぶりで、ガルドには一度も言われたことがないと内心で思った。預かり証を渡すとき指先が触れ、首筋まで赤くなった
      source: Day1昼
      status: 確定した事実
    噂_ミルカの席外し:
      fact: 西大通りの布屋の女主人（この店先で二年）が、Day1昼にミルカが席外しの札を立てて男を奥の小部屋へ連れていったのを見ており、『春が来た』と噂していた。ミルカも覗かれていた気がして気にしている
      source: Day1昼過ぎ
      status: 街の噂
    ミルカの作戦案_侵入で押さえる:
      fact: 暴行を待たず、ガルドが夜に裏口から入り2Fの衣装箱を開けた時点で衛兵に押さえさせる。ガルドは鍵を渡されているため、先にセレナから衛兵隊へ『もう家に入れたくない』と届けておけば侵入として扱える。懐にセレナ名義の偽の証文があればなお良い。衛兵隊も一月毎晩は張れないため日付の特定が要る（ドーンに当たる）
      source: Day1昼過ぎ ミルカの提案
      status: ミルカの提案（未実行）
    ドーン_Day1夕の様子:
      fact: Day1夕、納品口で灰色の獣の毛皮数枚と牙の束を売った。誰とも目を合わせず壁沿いを歩き、疲れた顔で眉間に深い縦皺。内心で『三十日まであとひと月もない』と気にしている
      source: Day1夕
      status: 確定した事実（内心は〇〇には聞こえていない）
    人物_ドーン_口調:
      fact: 低くかすれた声。口数が少なく、短く切る男言葉（『……登録札が、ない』『……少しなら』『ガルドとは組まねえのか』）
      status: 確定した事実
    ドーンの言葉_ガルド:
      fact: ドーンはガルドと組んで四年。一年前ダンジョン三階で腹を裂かれ、ガルドが背負って上まで戻ってくれた恩がある。仲間募集の札は出しておらず出す気もないと言う。一方、初対面の〇〇に『最近のあいつは昔のあいつじゃねえ。今から組む相手を探してるなら、ガルドはやめとけ』と漏らした
      source: Day1夕 ドーン本人の言葉
      status: 確定した事実
    ドーンの言葉_ガルドの変化:
      fact: 四年前のガルドは依頼を選び、危ない時は引き、稼ぎの半分を貯めるまっとうな剣士だった。セレナと婚約した時は酒場でドーンに三杯おごった（人におごったのはそれきり）。半年ほど前から銀蛇亭に出入りし始め、依頼に出なくなり、報酬の前借りの話ばかり。負けた日はセレナに当たり人前で怒鳴る。最近は灰色外套の葉巻臭い男（シラス）とつるみ、その男が来るとガルドの目つきが変わる。ドーンはその先を知っている様子だが『ガルドの仲間として言えねえ』と口を閉ざした
      source: Day1夕 ドーン本人の言葉
      status: 確定した事実
    ガルドの計画_ドーンの証言:
      fact: 決行は箱庭暦1年1月29日の夜（締めの前の晩。セレナが締めの支度で遅くまで起き、その後深く眠る）。ガルドが合鍵で白百合香房の裏口から入り2Fから権利書を持ち出す。シラスが用意した証文『白百合香房の権利を、借金三千Gのカタとして銀蛇亭のバルトに渡す』にシラスがセレナの名を書く。その夜のうちに銀蛇亭の裏でバルトに渡し、ガルドの借金は帳消し。ドーンは路地の見張り役で分け前二百G。返事はDay1から三日のうち（Day3まで）にと言われた。ドーンはまだ返事をしていない
      source: Day1夕 ドーン本人の証言
      status: 確定した事実（ドーンの証言）
    人物_ドーン_能力:
      fact: D級斧使い。STR 14 / DEF 12 / INT 7 / SPD 6 / TEC 9 / CHM 5（GM設定）
      status: GM参照用
    ドーンの決意:
      fact: ドーンは今のガルドは仲間ではないと認めた。三年前ガルドが街道で野盗三人からセレナを助けた場にドーンもいた。見張りを断ると別の見張りを立てられたり日を変えられたりするため、乗ったふりをして当日まで動きを探る案を自分から出した。協力の条件は『セレナが傷つかない方法だと約束すること』
      source: Day1夕
      status: ドーンの提案と条件（〇〇はまだ返事をしていない）
