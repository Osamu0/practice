<style>
.hf{font-family:inherit;color:var(--hatch-widget-text);background:var(--hatch-widget-bg);box-sizing:border-box;padding:8px}.hf *{box-sizing:border-box}.hf h3{margin:4px 0;font-size:16px}.sub,.foot,.msg,.note{color:var(--hatch-widget-muted);font-size:12px}.q{border:1px solid var(--hatch-widget-border);background:var(--hatch-widget-surface);border-radius:10px;padding:10px;margin:8px 0}.q.done{border-color:var(--hatch-widget-accent)}.q.invalid{border-color:#c44}.ql{font-weight:600;margin-bottom:6px;font-size:14px}.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.opts button,.confirm{border:1px solid var(--hatch-widget-border);background:var(--hatch-widget-surface-muted);color:var(--hatch-widget-text);border-radius:999px;padding:7px 11px;font-size:12px;cursor:pointer;text-align:left}.opts button.on,.confirm{background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);border-color:var(--hatch-widget-accent)}.q input{width:100%;padding:7px 9px;border:1px solid var(--hatch-widget-border);border-radius:8px;background:var(--hatch-widget-bg);color:var(--hatch-widget-text);font-size:13px}.confirm{border-radius:8px;width:100%;text-align:center;font-weight:700}.confirm:disabled{opacity:.45;cursor:not-allowed}#cnt{font-weight:600;color:var(--hatch-widget-accent)}#msg.ok{color:var(--hatch-widget-accent)}#msg.err{color:#c44}
</style>
<div class="hf">
<h3>初回ヒアリング ステップ2（名前・性別・年齢）</h3>
<p class="sub">「ふぅん♡ なるほどね♡ ——じゃあ、次はアナタのことを教えなさい♡」</p>
<p class="note">年齢は18以上の整数が必須です。性別は選択または自由入力のどちらかを使ってください。</p>
<div id="qs"></div>
<p class="foot"><span id="cnt"></span></p>
<button id="confirm" class="confirm" type="button">この内容で確定</button>
<p id="msg" class="msg" aria-live="polite"></p>
</div>
<script>
const WIDGET_SCHEMA="machadan.hearing.widget.v2",STEP_ID="profile",STEP=2,NEXT_STEP="body_profile";
const QS=[
 {id:"name",type:"text",required:false,label:"1. 名前は？",placeholder:"例：この世界で名乗りたい名前"},
 {id:"gender",type:"single",required:true,label:"2. 性別は？",opts:[["male","男性"],["female","女性"]],free:"そのほか（自由入力）"},
 {id:"age",type:"number",required:true,min:18,label:"3. 年齢は？（18歳以上の成人のみ）",placeholder:"例：24"}
];
function blankAnswer(q){return q.type==="text"?"":q.type==="number"?null:{choice:"",free_text:""};}
function fresh(){const answers={};QS.forEach(q=>answers[q.id]=blankAnswer(q));return{schema:WIDGET_SCHEMA,schema_version:2,step:STEP,step_id:STEP_ID,next_step:NEXT_STEP,revision:0,valid:false,complete:false,answers,validation:{errors:[]}};}
let S=fresh();
function migrate(raw){if(!raw||typeof raw!=="object")return fresh();if(raw.schema===WIDGET_SCHEMA){const n=fresh();Object.assign(n,raw);n.answers=Object.assign(n.answers,raw.answers||{});const age=Number(n.answers.age);n.answers.age=Number.isInteger(age)?age:null;return n;}const n=fresh();if(raw.name)n.answers.name=String(raw.name.text||"");if(raw.sex){const key=(raw.sex.sel||[])[0],map={"1":"男性","2":"女性"};n.answers.gender={choice:map[key]||"",free_text:String(raw.sex.free||"")};}if(raw.age){const age=Number.parseInt(String(raw.age.text||""),10);n.answers.age=Number.isInteger(age)?age:null;}return n;}
function hasValue(q){const a=S.answers[q.id];if(q.type==="text")return!!String(a||"").trim();if(q.type==="number")return Number.isInteger(a);return!!(a.choice||a.free_text.trim());}
function validate(){const errors=[];const g=S.answers.gender;if(!(g.choice||g.free_text.trim()))errors.push("性別を選ぶか自由入力してください");const age=S.answers.age;if(!Number.isInteger(age)||age<18)errors.push("年齢は18以上の整数で入力してください");S.validation={errors};S.valid=errors.length===0;return S.valid;}
function persist(){hydrated=true;try{window.hatchWidget.setState(JSON.parse(JSON.stringify(S)));}catch(e){}}
function mutate(fn,full=true,persistNow=true){fn();S.revision=(S.revision||0)+1;S.complete=false;validate();if(full)render();else refresh();if(persistNow)persist();}
function refresh(){QS.forEach(q=>{const el=document.getElementById("card-"+q.id);if(el){el.classList.toggle("done",hasValue(q));if(q.id==="age")el.classList.toggle("invalid",S.answers.age!==null&&(!Number.isInteger(S.answers.age)||S.answers.age<18));}});document.getElementById("cnt").textContent=QS.filter(hasValue).length+" / "+QS.length+" 項目 入力済み";const c=document.getElementById("confirm");c.disabled=!S.valid;c.textContent=S.complete?"確定済み":"この内容で確定";const m=document.getElementById("msg");m.className="msg "+(S.complete?"ok":S.validation.errors.length?"err":"");m.textContent=S.complete?"確定しました。チャットへ戻ると次のステップへ進みます。":(S.validation.errors[0]||"");}
function render(){validate();const root=document.getElementById("qs");root.innerHTML="";QS.forEach(q=>{const a=S.answers[q.id],card=document.createElement("div");card.className="q"+(hasValue(q)?" done":"");card.id="card-"+q.id;if(q.id==="age"&&a!==null&&(!Number.isInteger(a)||a<18))card.classList.add("invalid");const label=document.createElement("div");label.className="ql";label.textContent=q.label;card.appendChild(label);if(q.type==="single"){const opts=document.createElement("div");opts.className="opts";q.opts.forEach(o=>{const b=document.createElement("button");b.type="button";b.textContent=o[1];b.classList.toggle("on",a.choice===o[1]);b.onclick=()=>mutate(()=>{a.choice=a.choice===o[1]?"":o[1];if(a.choice)a.free_text="";});opts.appendChild(b);});card.appendChild(opts);const input=document.createElement("input");input.type="text";input.placeholder=q.free;input.value=a.free_text;input.oninput=()=>mutate(()=>{a.free_text=input.value;if(a.free_text.trim())a.choice="";},false,false);input.onblur=persist;card.appendChild(input);}else{const input=document.createElement("input");input.type=q.type==="number"?"number":"text";if(q.type==="number"){input.min=String(q.min);input.step="1";input.inputMode="numeric";}input.placeholder=q.placeholder||"";input.value=a===null?"":String(a);input.oninput=()=>mutate(()=>{if(q.type==="number"){const raw=input.value.trim();S.answers[q.id]=raw===""?null:(/^[0-9]+$/.test(raw)?Number(raw):null);}else S.answers[q.id]=input.value;},false,false);input.onblur=persist;card.appendChild(input);}root.appendChild(card);});refresh();}
document.getElementById("confirm").onclick=()=>{if(!validate()){render();return;}S.revision++;S.complete=true;render();persist();};
let hydrated=false;function accept(raw){const n=migrate(raw),nr=n.revision||0,sr=S.revision||0;if(nr<sr||(hydrated&&nr===sr))return;S=n;hydrated=true;render();}
render();try{const r=window.hatchWidget.getState(fresh());if(r&&typeof r.then==="function")r.then(accept).catch(()=>{});else accept(r);}catch(e){}
window.addEventListener("hatch-widget-state",e=>{if(e.detail&&e.detail.state)accept(e.detail.state);});
</script>
