<style>
.hf{font-family:inherit;color:var(--hatch-widget-text);background:var(--hatch-widget-bg);box-sizing:border-box;padding:8px}.hf *{box-sizing:border-box}.hf h3{margin:4px 0;font-size:16px}.sub,.foot,.msg{color:var(--hatch-widget-muted);font-size:12px}.q{border:1px solid var(--hatch-widget-border);background:var(--hatch-widget-surface);border-radius:10px;padding:10px;margin:8px 0}.q.done{border-color:var(--hatch-widget-accent)}.ql{font-weight:600;margin-bottom:6px;font-size:14px}.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.opts button,.confirm{border:1px solid var(--hatch-widget-border);background:var(--hatch-widget-surface-muted);color:var(--hatch-widget-text);border-radius:999px;padding:7px 11px;font-size:12px;cursor:pointer;text-align:left}.opts button.on,.confirm{background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);border-color:var(--hatch-widget-accent)}.q input{width:100%;padding:7px 9px;border:1px solid var(--hatch-widget-border);border-radius:8px;background:var(--hatch-widget-bg);color:var(--hatch-widget-text);font-size:13px}.confirm{border-radius:8px;width:100%;text-align:center;font-weight:700}#cnt{font-weight:600;color:var(--hatch-widget-accent)}#msg.ok{color:var(--hatch-widget-accent)}
</style>
<div class="hf">
<h3>初回ヒアリング ステップ3（男性の体格）</h3>
<p class="sub">未指定の項目はおまかせとして扱います。複数選択の項目は複数選べます。</p>
<div id="qs"></div>
<p class="foot"><span id="cnt"></span></p>
<button id="confirm" class="confirm" type="button">この内容で確定</button>
<p id="msg" class="msg" aria-live="polite"></p>
</div>
<script>
const WIDGET_SCHEMA="machadan.hearing.widget.v2",STEP_ID="body_male",STEP=3,NEXT_STEP="desire";
const QS=[
 {id:"height",type:"single",label:"1. 身長はどのくらいがいい？",opts:[["1","小柄"],["2","やや小柄"],["3","中くらい"],["4","やや大柄"],["5","大柄"],["0","おまかせ"]],free:"具体的な身長（cm）など（自由入力）"},
 {id:"muscle",type:"multi",label:"2. 筋肉の付き方（ガタイ）は？",opts:[["1","華奢・細身"],["2","引き締まった"],["3","標準"],["4","ムキムキ"],["5","がっしり・ガチムチ"],["6","むっちり"],["0","おまかせ"]],free:"そのほか（自由入力）"},
 {id:"size",type:"single",label:"3. おちんちんのサイズは？",opts:[["1","小さめ"],["2","普通"],["3","大きめ"],["4","特大"],["0","おまかせ"]],free:"そのほか（自由入力）"}
];
function blank(q){return q.type==="multi"?{choices:[],free_text:""}:{choice:"",free_text:""};}
function fresh(){const answers={};QS.forEach(q=>answers[q.id]=blank(q));return{schema:WIDGET_SCHEMA,schema_version:2,step:STEP,step_id:STEP_ID,next_step:NEXT_STEP,revision:0,valid:true,complete:false,answers,validation:{errors:[]}};}
let S=fresh();
function migrate(raw){if(!raw||typeof raw!=="object")return fresh();if(raw.schema===WIDGET_SCHEMA){const n=fresh();Object.assign(n,raw);n.answers=Object.assign(n.answers,raw.answers||{});return n;}const n=fresh();QS.forEach(q=>{const v=raw[q.id];if(!v)return;const labels=(v.sel||[]).map(k=>{const o=q.opts.find(x=>x[0]===k);return o?o[1]:k;});n.answers[q.id]=q.type==="multi"?{choices:labels,free_text:String(v.free||"")}:{choice:labels[0]||"",free_text:String(v.free||"")};});return n;}
function hasValue(q){const a=S.answers[q.id];return q.type==="multi"?!!(a.choices.length||a.free_text.trim()):!!(a.choice||a.free_text.trim());}
function persist(){hydrated=true;try{window.hatchWidget.setState(JSON.parse(JSON.stringify(S)));}catch(e){}}
function markChanged(fn,full,persistNow=true){fn();S.revision=(S.revision||0)+1;S.complete=false;if(full)render();else refresh();if(persistNow)persist();}
function refresh(){QS.forEach(q=>{const el=document.getElementById("card-"+q.id);if(el)el.classList.toggle("done",hasValue(q));});document.getElementById("cnt").textContent=QS.filter(hasValue).length+" / "+QS.length+" 項目 入力済み";const c=document.getElementById("confirm");c.textContent=S.complete?"確定済み":"この内容で確定";const m=document.getElementById("msg");m.className="msg"+(S.complete?" ok":"");m.textContent=S.complete?"確定しました。チャットへ戻ると次のステップへ進みます。":"未指定の項目はおまかせになります。";}
function render(){const root=document.getElementById("qs");root.innerHTML="";QS.forEach(q=>{const a=S.answers[q.id],card=document.createElement("div");card.className="q";card.id="card-"+q.id;const label=document.createElement("div");label.className="ql";label.textContent=q.label;card.appendChild(label);const opts=document.createElement("div");opts.className="opts";q.opts.forEach(o=>{const on=q.type==="multi"?a.choices.includes(o[1]):a.choice===o[1],b=document.createElement("button");b.type="button";b.textContent=o[0]+". "+o[1];b.classList.toggle("on",on);b.onclick=()=>markChanged(()=>{if(q.type==="multi"){if(o[0]==="0")a.choices=on?[]:[o[1]];else{a.choices=a.choices.filter(x=>x!=="おまかせ");a.choices=on?a.choices.filter(x=>x!==o[1]):a.choices.concat(o[1]);}}else a.choice=on?"":o[1];},true);opts.appendChild(b);});card.appendChild(opts);const input=document.createElement("input");input.type="text";input.placeholder=q.free;input.value=a.free_text;input.oninput=()=>markChanged(()=>{a.free_text=input.value;},false,false);input.onblur=persist;card.appendChild(input);root.appendChild(card);});refresh();}
document.getElementById("confirm").onclick=()=>{S.revision++;S.complete=true;render();persist();};
let hydrated=false;function accept(raw){const n=migrate(raw),nr=n.revision||0,sr=S.revision||0;if(nr<sr||(hydrated&&nr===sr))return;S=n;hydrated=true;render();}
render();try{const r=window.hatchWidget.getState(fresh());if(r&&typeof r.then==="function")r.then(accept).catch(()=>{});else accept(r);}catch(e){}
window.addEventListener("hatch-widget-state",e=>{if(e.detail&&e.detail.state)accept(e.detail.state);});
</script>
