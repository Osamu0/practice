<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>冒険者ステータス</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10131b;
      --surface: #191e2a;
      --surface-2: #222a39;
      --line: #343d50;
      --text: #f4f2eb;
      --muted: #aab2c1;
      --accent: #edbd66;
      --lp: #e66c70;
      --mp: #68aee8;
      --ok: #79c995;
      --warn: #e7a760;
      --danger: #e87373;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    main { width: min(100%, 760px); margin: 0 auto; padding: 12px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 1rem; letter-spacing: .06em; }
    h2 { margin: 16px 2px 8px; font-size: .9rem; color: var(--accent); }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px;
      background: linear-gradient(135deg, var(--surface-2), var(--surface));
    }
    .meta { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; }
    .pill {
      display: inline-flex; align-items: center; min-height: 24px; padding: 3px 8px;
      border: 1px solid var(--line); border-radius: 999px; background: #111722;
      color: var(--muted); font-size: .72rem; white-space: nowrap;
    }
    .pill.due { border-color: var(--warn); color: #ffd59a; }
    .pill.pending { border-color: var(--danger); color: #ffaaaa; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
    details.card, details.inventory-card {
      border: 1px solid var(--line); border-radius: 12px; overflow: clip;
      background: var(--surface); box-shadow: 0 5px 18px rgba(0, 0, 0, .14);
    }
    summary {
      list-style: none; cursor: pointer; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    summary::-webkit-details-marker { display: none; }
    summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
    .character-summary { padding: 10px 11px; }
    .summary-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .name { font-weight: 750; font-size: .94rem; overflow-wrap: anywhere; }
    .job { color: var(--muted); font-size: .72rem; text-align: right; }
    .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .meter-label { display: flex; justify-content: space-between; font-size: .7rem; margin-bottom: 3px; }
    .track { height: 6px; overflow: hidden; border-radius: 999px; background: #0b0f17; }
    .fill { display: block; height: 100%; border-radius: inherit; }
    .lp .fill { background: var(--lp); }
    .mp .fill { background: var(--mp); }
    .expand-hint { margin-top: 7px; color: var(--muted); font-size: .66rem; text-align: right; }
    details[open] .expand-hint::before { content: "閉じる ▴"; }
    details:not([open]) .expand-hint::before { content: "詳細 ▾"; }
    .details-body { padding: 0 11px 11px; border-top: 1px solid var(--line); }
    .stat-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 10px 0; }
    .stat { padding: 5px 2px; border-radius: 7px; background: var(--surface-2); text-align: center; }
    .stat b { display: block; color: var(--muted); font-size: .6rem; }
    .stat span { font-size: .82rem; font-variant-numeric: tabular-nums; }
    .info-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; font-size: .72rem; }
    .info-grid dt { color: var(--muted); }
    .info-grid dd { margin: 0; overflow-wrap: anywhere; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .tag { padding: 2px 6px; border-radius: 6px; background: var(--surface-2); color: #dce2ed; font-size: .66rem; }
    .empty { padding: 12px; color: var(--muted); font-size: .76rem; text-align: center; }
    .inventory-summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 11px; }
    .capacity { min-width: 112px; }
    .capacity-row { display: flex; justify-content: space-between; gap: 10px; font-size: .74rem; }
    .inventory-body { border-top: 1px solid var(--line); }
    .item-list { list-style: none; margin: 0; padding: 0; }
    .item-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 8px 11px; border-bottom: 1px solid var(--line); }
    .item-row:last-child { border-bottom: 0; }
    .item-name { font-size: .78rem; overflow-wrap: anywhere; }
    .item-sub { color: var(--muted); font-size: .65rem; margin-top: 2px; }
    .item-count { font-size: .75rem; font-variant-numeric: tabular-nums; text-align: right; }
    .reserved { color: var(--warn); }
    .warehouse { padding: 9px 11px; border-top: 1px solid var(--line); color: var(--muted); font-size: .7rem; }
    .error { padding: 18px; border: 1px solid var(--danger); border-radius: 12px; color: #ffb8b8; background: #321b22; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 430px) {
      main { padding: 8px; }
      .topbar { align-items: flex-start; }
      .meta { max-width: 62%; }
      .stat-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (prefers-reduced-motion: no-preference) {
      details { transition: border-color .16s ease; }
      details[open] { border-color: #59647b; }
    }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script id="status-snapshot" type="application/json">__STATUS_SNAPSHOT_JSON__</script>
  <script>
    (() => {
      "use strict";
      const app = document.getElementById("app");
      const node = (tag, cls, text) => {
        const el = document.createElement(tag);
        if (cls) el.className = cls;
        if (text !== undefined && text !== null) el.textContent = String(text);
        return el;
      };
      const append = (parent, ...children) => {
        for (const child of children) if (child) parent.appendChild(child);
        return parent;
      };
      const number = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
      const text = (value, fallback = "—") => value === undefined || value === null || value === "" ? fallback : String(value);
      const meter = (kind, value) => {
        const cur = Math.max(0, number(value && value.cur));
        const max = Math.max(0, number(value && value.max));
        const box = node("div", "meter " + kind);
        const label = node("div", "meter-label");
        append(label, node("span", "", kind.toUpperCase()), node("span", "", `${cur} / ${max}`));
        const track = node("div", "track");
        const fill = node("span", "fill");
        fill.style.width = `${max > 0 ? Math.min(100, (cur / max) * 100) : 0}%`;
        fill.setAttribute("role", "meter");
        fill.setAttribute("aria-label", kind.toUpperCase());
        fill.setAttribute("aria-valuemin", "0");
        fill.setAttribute("aria-valuemax", String(max));
        fill.setAttribute("aria-valuenow", String(cur));
        append(track, fill);
        return append(box, label, track);
      };
      const addInfo = (dl, label, value) => {
        append(dl, node("dt", "", label), node("dd", "", text(value)));
      };
      const renderCharacter = (character) => {
        const details = node("details", "card");
        const summary = node("summary", "character-summary");
        const head = node("div", "summary-head");
        append(head, node("span", "name", text(character.name, "名前未設定")), node("span", "job", text(character.job, "無職")));
        const meters = node("div", "meters");
        append(meters, meter("lp", character.lp), meter("mp", character.mp));
        append(summary, head, meters, node("div", "expand-hint"));
        const body = node("div", "details-body");
        const stats = node("div", "stat-grid");
        const effective = character.effective_stats || {};
        for (const [key, label] of [["str","STR"],["def","DEF"],["int","INT"],["spd","SPD"],["tec","TEC"],["chm","CHM"]]) {
          const stat = node("div", "stat");
          append(stat, node("b", "", label), node("span", "", number(effective[key])));
          stats.appendChild(stat);
        }
        const info = node("dl", "info-grid");
        const equip = character.equipment || {};
        addInfo(info, "種族", character.race);
        addInfo(info, "役割", character.role || (character.job_profile && character.job_profile.combat_role));
        addInfo(info, "武器", equip.weapon_name || equip.weapon_instance_id);
        addInfo(info, "防具", equip.armor_name || equip.armor_instance_id);
        addInfo(info, "副装備", equip.offhand_name || equip.offhand_instance_id);
        const fixed = Array.isArray(equip.fixed) ? equip.fixed.join("、") : "";
        addInfo(info, "固定", fixed);
        addInfo(info, "ero_scene", character.ero_scene ? "on" : "off");
        addInfo(info, "ero_style", character.ero_style);
        const tags = node("div", "tags");
        const states = []
          .concat(Array.isArray(character.statuses) ? character.statuses : [])
          .concat(Array.isArray(character.buffs) ? character.buffs : [])
          .concat(Array.isArray(character.ero_status) ? character.ero_status : []);
        if (states.length) for (const state of states) tags.appendChild(node("span", "tag", typeof state === "string" ? state : text(state.name || state.id)));
        else tags.appendChild(node("span", "tag", "状態異常なし"));
        append(body, stats, info, tags);
        return append(details, summary, body);
      };
      const renderInventory = (inventory) => {
        const details = node("details", "inventory-card");
        const summary = node("summary", "inventory-summary");
        const bag = inventory.bag || {};
        const used = number(bag.used_slots);
        const physical = number(bag.max_slots);
        const bonus = number(bag.skill_bonus_slots);
        const max = number(bag.effective_max_slots, physical + bonus);
        const title = node("div", "");
        append(title, node("div", "name", "遠征袋"), node("div", "item-sub", "タップで所持品を表示"));
        const capacity = node("div", "capacity");
        const row = node("div", "capacity-row");
        const capacityText = bonus > 0
          ? `${used} / ${physical}+${bonus}=${max}`
          : `${used} / ${max}`;
        append(row, node("span", "", "使用枠"), node("strong", "", capacityText));
        const track = node("div", "track");
        const fill = node("span", "fill");
        fill.style.width = `${max > 0 ? Math.min(100, (used / max) * 100) : 0}%`;
        fill.style.background = used >= max && max > 0 ? "var(--danger)" : "var(--ok)";
        append(track, fill); append(capacity, row, track); append(summary, title, capacity);
        const body = node("div", "inventory-body");
        const stacks = Array.isArray(inventory.carried_stacks) ? inventory.carried_stacks : [];
        if (!stacks.length) body.appendChild(node("div", "empty", "遠征袋は空です"));
        else {
          const list = node("ul", "item-list");
          for (const item of stacks) {
            const count = number(item.count);
            const reserved = Math.max(0, number(item.reserved_quantity));
            const available = Math.max(0, count - reserved);
            const row = node("li", "item-row");
            const desc = node("div", "");
            append(desc, node("div", "item-name", text(item.name, item.item_def_id)), node("div", "item-sub", text(item.category, "その他")));
            const qty = node("div", "item-count");
            qty.appendChild(node("div", "", `×${count}`));
            if (reserved) qty.appendChild(node("div", "reserved", `予約 ${reserved}／使用可 ${available}`));
            append(row, desc, qty); list.appendChild(row);
          }
          body.appendChild(list);
        }
        const uniqueItems = Array.isArray(inventory.carried_instances) ? inventory.carried_instances : [];
        for (const item of uniqueItems) {
          const row = node("div", "item-row");
          const desc = node("div", "");
          append(desc, node("div", "item-name", text(item.name, item.instance_id)), node("div", "item-sub", `固有品 · ${text(item.category, "その他")}`));
          append(row, desc, node("div", "item-count", item.reserved ? "予約中" : "×1"));
          body.appendChild(row);
        }
        const warehouse = inventory.warehouse || {};
        const warehouseStacks = Array.isArray(warehouse.stacks) ? warehouse.stacks : [];
        const warehouseInstances = Array.isArray(warehouse.instances) ? warehouse.instances : [];
        const warehouseInstanceIds = Array.isArray(warehouse.instance_ids) ? warehouse.instance_ids : [];
        const warehouseUnits = warehouseStacks.reduce((sum, item) => sum + Math.max(0, number(item.count)), 0) + warehouseInstanceIds.length;
        const reservations = Array.isArray(inventory.reservations) ? inventory.reservations.filter(item => item && item.status === "reserved").length : 0;
        body.appendChild(node("div", "warehouse", `倉庫: ${warehouseUnits}点 · 有効予約: ${reservations}件`));
        if (warehouseUnits > 0) {
          const warehouseList = node("ul", "item-list");
          for (const item of warehouseStacks) {
            const count = Math.max(0, number(item.count));
            const reserved = Math.max(0, number(item.reserved_quantity));
            const row = node("li", "item-row");
            const desc = node("div", "");
            append(desc, node("div", "item-name", `倉庫 · ${text(item.name, item.item_def_id)}`), node("div", "item-sub", text(item.category, "その他")));
            const qty = node("div", "item-count", `×${count}`);
            if (reserved) qty.appendChild(node("div", "reserved", `予約 ${reserved}`));
            append(row, desc, qty); warehouseList.appendChild(row);
          }
          for (const item of warehouseInstances) {
            const row = node("li", "item-row");
            const desc = node("div", "");
            append(desc, node("div", "item-name", `倉庫 · ${text(item.name, item.instance_id)}`), node("div", "item-sub", "固有品"));
            append(row, desc, node("div", "item-count", "×1")); warehouseList.appendChild(row);
          }
          body.appendChild(warehouseList);
        }
        return append(details, summary, body);
      };
      try {
        const raw = document.getElementById("status-snapshot").textContent;
        const snapshot = JSON.parse(raw);
        const header = snapshot.header || {};
        const topbar = node("header", "topbar");
        topbar.appendChild(node("h1", "", text(snapshot.title, "冒険者ステータス")));
        const meta = node("div", "meta");
        meta.appendChild(node("span", "pill", `${text(header.day, "?")}日目`));
        meta.appendChild(node("span", "pill", `Turn ${text(header.turn, "?")}`));
        meta.appendChild(node("span", "pill", `Rev ${text(header.revision, "?")}`));
        meta.appendChild(node("span", "pill", `${number(header.gold)}G`));
        if (header.debt) {
          const debt = header.debt;
          const dueClass = debt.collection_pending ? "pill pending" : "pill due";
          const dueText = debt.collection_pending
            ? `取立て待ち ${number(debt.scheduled_due)}G`
            : `借金 ${number(debt.principal)}G · 次回${text(debt.next_collection_day, "?")}日`;
          meta.appendChild(node("span", dueClass, dueText));
        }
        topbar.appendChild(meta); app.appendChild(topbar);
        const forecast = snapshot.finance_forecast || {};
        if (Array.isArray(forecast.lines) && forecast.lines.length) {
          const view = node("details", "");
          view.appendChild(node("summary", "", "収支の見通し"));
          for (const line of forecast.lines) view.appendChild(node("p", "warehouse", line));
          app.appendChild(view);
        }
        app.appendChild(node("h2", "", "パーティー"));
        const cards = node("section", "cards");
        cards.setAttribute("aria-label", "パーティーステータス");
        const characters = Array.isArray(snapshot.characters) ? snapshot.characters : [];
        if (characters.length) for (const character of characters) cards.appendChild(renderCharacter(character || {}));
        else cards.appendChild(node("div", "empty", "キャラクターデータがありません"));
        app.appendChild(cards);
        app.appendChild(node("h2", "", "所持品"));
        app.appendChild(renderInventory(snapshot.inventory || {}));
      } catch (error) {
        const box = node("div", "error");
        append(box, node("strong", "", "ステータスを表示できません"), node("p", "", "保存データの検証後に再度開いてください。"));
        app.replaceChildren(box);
      }
    })();
  </script>
</body>
</html>
