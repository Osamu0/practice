      mode: full
    - resource: COMBAT
      mode: full
    - resource: DUNGEON_RULES
      mode: full
    - resource: CHECKS
      mode: full
    - resource: ITEMS
      mode: sections
      selectors: &id001
      - match: SYS-Item_Generation_Rules
      - match: CONSUMABLES
      - match: CARRY_CAPACITY_M92
      - match: ECONOMY_RULES
    - resource: OPERATIONS
      mode: sections
      selectors:
      - id: COMBAT_ESCAPE
        match: 戦闘からの逃走
    conditional:
    - when: firearm_action
      resources:
      - FIREARMS
      mode: full
    - when: capture
      resources:
      - CAPTURE_RULES
      mode: full
    dynamic:
    - kind: enemy_entries
      resource: MONSTERS
      mode: sections
    - kind: active_character_personas
      directory: 人格
      mode: full
    - kind: dungeon_floor
      resource: DUNGEON_DATA
      mode: sections
    - kind: named_items
