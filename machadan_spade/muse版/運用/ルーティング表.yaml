schema: machadan-routing-v1
version: 3
registry: 運用/正本レジストリ.yaml
generated_context: state/runtime/current_context.md
rules:
- base_packは全ターンで必要。現在の場面と対象に必要な節を末尾まで読む。
- 未定義の人物・場所・行動は創作の余地。検索失敗だけで物語全体を止めない。
- 定義済みの設定はID・別名・正本の節または全文で内部補完する。
- fullが同じ資料のsectionsを包含する。同じ節と包含された節は重ねて読まない。
- 表示用の状態抜粋を完全なセーブとして保存しない。変更は完全候補へ適用する。
- セーブ破損・解決不能な正本衝突と、未設定の物語の補完は区別する。
- 人格読込時はACTIVE_SAVE_VIEWのruntime_cast_rulesと対象の外見上書きを併読する。段階解禁を台詞や好感度から推測しない。
base_pack:
  required:
  - resource: REGIONAL_WORLD
    mode: full
  - resource: PLACE_ATLAS
    mode: full
  - resource: TURN_CONTRACT
    mode: full
  - resource: STYLE_CARD
    mode: sections
    selectors:
    - id: H_0B728F7F27996D54
      match: (a) 適用条件
    - id: H_21C8C14723163E74
      match: (b) 書式
    - id: H_FAFBC99BE5A18DFF
      match: (d) プレイヤー代筆
    - id: H_DD0FE5C893AF5A49
      match: (l) ラビトレ文体
    - id: H_515937B7DC740DF7
      match: (p) 冒険シーン
    - id: H_ACA08DB4531AF305
      match: (q) 出力の語彙
  - resource: CORE_RULES
    mode: sections
    selectors:
    - match: §1 不変条件
    - match: §16 節目の提示
    - match: §17 GMの物語外発言
  - resource: WORLD
    mode: sections
    selectors:
    - match: 1. World Setting
  - resource: MAGITECH
    mode: full
  - dynamic: active_save
    mode: full
  verify_after_turn:
  - resource: STATUS_CHECK
    mode: sections
    selectors:
    - match: 1. 確定の原則
    - match: 4. 不整合時の処理
scene_packs:
  start:
    aliases:
    - new
    - 新規
    - 開始
    - 起動
    - マチャダンを始めて
    required:
    - resource: ACTIVE_INSTRUCTIONS
      mode: sections
      selectors:
      - match: 5. 出力契約
    - resource: COMMANDS
      mode: sections
      selectors:
      - id: COMMAND_START
        match: Command S
    - resource: BOOT_WORLD
      mode: full
    - resource: WORLD
      mode: full
    - resource: STYLE_CARD
      mode: sections
      selectors:
      - id: STYLE_MODE
        match: (m)
      - id: STYLE_STATUS
        match: (n)
      - id: STYLE_COVERAGE
        match: (o)
    dynamic:
    - kind: current_opening_script
      resource: TEMPLATES
      mode: sections
  resume:
    aliases:
    - continue
    - ロード
    - 再開
    - 続き
    - マチャダンを続けて
    required:
    - resource: ACTIVE_INSTRUCTIONS
      mode: sections
      selectors:
      - match: 5. 出力契約
    - resource: COMMANDS
      mode: sections
      selectors:
      - id: COMMAND_LOAD
        match: Command A
    - resource: STATUS_CHECK
      mode: full
    dynamic:
    - kind: active_save
      mode: full
      required: true
    - kind: active_character_personas
      directory: 人格
      mode: full
    - kind: current_location
      resource: LOCATIONS
      mode: sections
    - kind: world_context
      resource: WORLD
      mode: sections
  turn:
    aliases:
    - action
    - 通常ターン
    - 移動
    - 会話
    required:
    - resource: ACTIVE_INSTRUCTIONS
      mode: sections
      selectors:
      - match: 5. 出力契約
    - resource: STYLE_CARD
      mode: sections
      selectors:
      - id: ADVENTURE_PROSE
        match: (p)
    - resource: CAST_MOVEMENT
      mode: full
    - resource: GM_CARD
      mode: sections
      selectors:
      - match: ロール早見
    dynamic:
    - kind: active_character_personas
      directory: 人格
      mode: full
    - kind: current_location
      resource: LOCATIONS
      mode: sections
    - kind: named_items
      resource: ITEMS
      mode: sections
    - kind: world_context
      resource: WORLD
      mode: sections
  combat:
