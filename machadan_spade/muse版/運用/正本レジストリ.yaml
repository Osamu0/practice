schema: machadan-canonical-registry-v1
version: 2
runtime_root: ..
generated_views:
- ナレッジ索引.md
- 運用/ルーティング表.md
- tools/anchors.json
- 世界/舞台資料集.md
- 世界/地方世界資料集.md
precedence:
- hard_invariants
- latest_active_decision
- active_save
- canonical
- supporting
- superseded
hard_invariants:
- id: ADULT_ONLY_INTIMATE_CONTENT
  rule: 恋愛・性的な関わりの対象は人間換算18歳以上の成人に限る。数値年齢または正本上の明確な成人指定で確認する。プレイヤー年齢は数値必須かつ18以上。リリス等、正本で成人と確定した年齢不詳キャストには数値を創作しない。
- id: SAVE_IS_CAMPAIGN_TRUTH
  rule: 所持品・金銭・数値・関係・進行・ダイス位置は現行セーブを正とする。
- id: NO_INVENTED_ROLLS
  rule: 出目は固定ダイステープからだけ取得し、成功させるための引き直しや飛ばし読みをしない。
- id: NO_HIDDEN_REASONING_OUTPUT
  rule: 旧GM_BRAINは使用・表示しない。検証は内部処理とツール結果で行う。
