reconciliation:
  search_order:
  - exact_term
  - aliases_and_synonyms
  - decision_id
  - canonical_full_section
  - latest_active_decision
  classifications:
  - stale_summary
  - missing_propagation
  - true_canonical_conflict
  automatic_actions:
    stale_summary: 正本が一意なら補助資料を更新し、再検証する。
    missing_propagation: 正本が一意なら参照先へ反映し、再検証する。
    true_canonical_conflict: 進行・ダイス消費・セーブ更新を止め、衝突箇所を利用者へ示す。
  never:
  - 正本の値を推測で補う
  - 履歴だけを根拠に現行正本を上書きする
  - 検証失敗のままターンまたは配布ビルドを確定する
