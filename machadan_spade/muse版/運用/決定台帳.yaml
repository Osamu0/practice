schema: machadan-decision-registry-v1
version: 1
history: null
history_note: 制作時の全変更履歴は配布しない。実行時はこの台帳と各canonical資料だけを使う。
active:
- id: M3
  subject: age_surface_setting
  rule: 成人性を魂年齢等の裏設定で補わず、表層設定そのものを成人にする。
  canonical: CORE_RULES
- id: M5
  subject: save_authority
  rule: 実セーブYAMLがキャンペーン状態の正本。
  canonical: SAVE_TEMPLATE
- id: M25
  subject: prose_loading_gate
  rule: 該当文体の正本を読み込んでから本文を生成する。
  canonical: STYLE_CARD
- id: M28
  subject: deterministic_dice
  rule: 固定ダイステープとセーブ内cursorを使用する。
  canonical: CORE_RULES
- id: M33
  subject: opposed_roll
  rule: 対抗判定は2d10対抗。M29を置換する。
  canonical: NUMBERS
- id: M38
  subject: numeric_authority
  rule: 確定数値は数値正本を優先する。
  canonical: NUMBERS
- id: M45
  subject: knowledge_routing
  rule: 場面別ルーティングと正本レジストリを通して読む。
  canonical: ROUTES
- id: M50
  subject: skill_system_minimum
  rule: 旧M49の初期案は後続改訂を優先する。
  canonical: SKILLS
- id: M59
  subject: stock_system
  rule: モブ・イベント在庫を補充可能にする。可変状態は状態領域へ分離する。
  canonical: RANDOM_EVENT_RULES
- id: M66
  subject: chekyun_tags
  rule: チェキュンは専用手順とプリセットの逐語要件に従う。
  canonical: CHEKYUN_CONSTRUCTOR
- id: M71
  subject: minor_nonsexual_presence
  rule: 18歳未満は生活・子育て等の非性的場面に限り得る。恋愛・性的接触の対象にはしない。
  canonical: CORE_RULES
- id: M76
  subject: skill_magic_acquisition
  rule: スキル・魔法の現行取得・セット方式はM76を正とする。
  canonical: SKILLS
- id: M81
  subject: remove_gm_brain
  rule: GM_BRAIN表示を廃止し、検証は内部処理とツールへ移す。
  canonical: CORE_RULES
- id: M82
  subject: narrative_quest_and_production_commissions
  rule: 全クエストを、固定脚本でなく事実・利害・制約・結果規則を持つ物語モデルとして生成する。生産職には製作・発明・悩み解決依頼を出し、調査・試作・実使用・結果別の余韻を含める。プレイヤーの想定外の解決と多様な結末を許す。
  canonical: QUEST_DESIGN
- id: M83
  subject: reward_contract_and_settlement
  rule: クエスト報酬は金・品物・権利・サービス・協力・紹介・情報等から、依頼者の資力・所有物・技能・権限・人脈と物語に自然な構成を選ぶ。種類数にノルマや禁止を設けず、無報酬も複合報酬も許す。受取時期と経路を契約へ記録し、プレイヤーは全部・一部・全部辞退を選べる。受領・辞退・失権は追記専用台帳に残し、同一成分の二重反映を防ぐ。
  canonical: QUEST_DESIGN
- id: M84
  subject: fixed_single_check_difficulty
  rule: 単独判定は[能力]+2d10と固定目標値を比較し、能力を目標側へ重ねない。容易16／標準19／困難22／過酷25に、M100の超難28／伝説31を追加する。対抗判定と捕獲の専用式は変更しない。
  canonical: NUMBERS
- id: M85
  subject: dungeon_cadence_and_interludes
  rule: M108で更新。探索・非ボス戦の固定上限と3危険区画条件は廃止。未攻略ボス接近、日次資源、長居襲来はDungeon_Data第1節を正本とする。
  canonical: DUNGEON_DATA
- id: M86
  subject: stat_fruit_progression_safety_net
  rule: C級初昇格で選べる能力の実を1個保証する。対象ボスの実判定が3回連続で外れた後の次回は確定。強敵対象、3F以降の宝箱二次表、ボス再戦条件を閉じた一覧で定め、全解決を一意IDで記録する。8Fミミックの実2個は固定source_idを持つ最初の特別個体1体だけのキャンペーン1回枠で、以後の通常ミミックからは出ない。
  canonical: DROPS
- id: M87
  subject: defend_dodge_and_enemy_ambush_profiles
  rule: 防御と回避専念を別の1行動として定義する。通常のSPD対抗は受動回避。敵奇襲は個体の奇襲タグと条件がある時だけ判定し、成立しても代表1体がTEC+2で通常命中判定する単体基本攻撃1回に限る。
  canonical: DUNGEON_RULES
- id: M89
  subject: recovery_item_action_cost
  rule: 戦闘中使用可能な回復アイテムは1個につき1行動を消費する。通常のLP回復品はLP1以上だけを対象とし、LP0の味方は気付け薬（300G、LP1復帰、同じ対象に1戦闘1回）でのみ起こせる。薬草・蜂蜜は安全な場所専用。
  canonical: ITEMS
- id: M90
  subject: adversarial_difficulty_and_threat_budgets
  rule: 敵性存在は勝利・殺害・捕縛等の目的へ本気で動き、観察済み情報、知性、役割、地形に基づいて退路遮断・集中攻撃・連携・撤退を行う。万能な後出し知識は使わず、1〜3人用の遭遇構成と脅威予算で標準戦も死に得る一段厳しい難易度へ調整する。死に戻りの借金加算は危険帯別にF/E/D級・1〜2F:+500G、C級・3〜4F:+1,000G、B級・5〜6F:+1,500G、A級・7〜9F:+2,000Gとし、ランクと階層が併存する時は高い方を用いる。
  canonical: COMBAT
- id: M91
  subject: save_v3_and_semantic_validation
  rule: セーブv3は主人公と仲間の共通Character型、能力内訳、ID参照の装備・所持品、クエスト不変部を正本化する。v2移行は冪等とし、負数・上限超過・ID重複・計算不一致・契約改変をスキーマとランタイムの双方で拒否する。
  canonical: SAVE_TEMPLATE
- id: M92
  subject: enterprise_professional_cases_and_product_development
  rule: 冒険職と店舗・工房を分離して永続化し、専門タグ、職業事件、未知素材、研究、試作、レシピ、材料予約、評判を一つの物語ループへ接続する。各話は完結させ、完結結果だけを後日の独立依頼候補にできる。
  canonical: ENTERPRISE
- id: M93
  subject: lilith_five_day_debt_cycle
  rule: リリスは5日ごとに取立てを行い、支払・一部支払・見送りを選べる。期間中に正の返済があれば次回請求は250G増え、未払いは20%式で元金へ一度だけ加算する。恋人関係でも免除せず、完済と同じtransactionで周期番号を増やした更新契約を自動設定する。更新本金と固有解禁はM103/M104を優先し、旧3択特典は自動付与しない。
  canonical: OPERATIONS
- id: M94
  subject: shared_inventory_and_muse_status_dashboard
  rule: 共有冒険バッグの物理容量は初期16枠、拡張ごと+4、最大28枠とし、荷物の心得は同行者の最高段だけを+2/+3/+4の派生容量として加える。使用枠は所持内容から再計算する。MUSEでは確定セーブの読取専用スナップショットとして、平時はLP/MPと実効容量だけ、タップ時は能力・装備・状態・所持品を展開する。
  canonical: SAVE_TEMPLATE
- id: M95
  subject: canonical_route_coverage
  rule: full/sectionで読むcanonical/supporting正本は、少なくとも一つのscene・condition・dynamic経路から到達可能でなければならない。例外は明示的なdeferred理由を持つものだけとし、doctorが未接続をエラーにする。
  canonical: ROUTES
- id: M96
  subject: class_role_expertise_and_skill_consistency
  rule: 職業名と戦闘役割・魔法役割・専門タグ・ソロ適性を分離する。初期技は基本位階に限り、技のtiming/action_cost、由来職、心得カテゴリ、二刀流等の装備条件を明示して職業名の解釈差をなくす。
  canonical: SKILLS
- id: PKG_SOURCELESS
  subject: distribution_scope
  rule: 配布物はMuse版本番ツリーで自己完結し、制作時の原資料を含めない。
  canonical: KNOWLEDGE_INDEX
- id: PKG_RECOVERY
  subject: recovery_policy
  rule: 機械的に一意な問題だけ自動修復し、正本同士の衝突は進行を止めて確認する。
  canonical: CANONICAL_REGISTRY
- id: M97
  subject: 自由な物語と確実な参照
  canonical: TURN_CONTRACT
  rule: 作者が明記した設定と数値を守り、未定義の場所・人物・出来事・手段は既存世界とルールに整合する形で自由に補完する。検索失敗だけで進行を止めない。継続する創作事実はキャンペーンのセーブへ記録する。
- id: M98
  subject: initial_budget_and_early_challenge
  canonical: NUMBERS
  rule: 新規主人公は基礎6能力各3に15ptを配分した33pt、基礎LP20から始め、リリスの火は別枠の既定値を維持する。新規生成仲間も33pt・各3以上を使い、加入済み・提示済み・固定人物・旧45pt配分・成長は一律減算しない。単独判定は固定目標値を維持し、敵の序盤調整は数値正本の明示値と既定行動だけで行う。
- id: M99
  subject: allocation_widgets_and_paid_retraining
  canonical: NUMBERS
  rule: 初期配分・能力の実・再訓練は＋／−の下書きUIを使い、本人のチャットの確定後だけ保存する。初期は各3＋15点、実は対応能力+1またはBaseLP+3。再訓練の配分範囲とLP/MP再計算はM102を優先する。
- id: M100
  subject: late_checks_and_companion_delegation
  canonical: CHECKS
  rule: 固定難度16/19/22/25に超難28・伝説31を加え、対象と方法から判定前に固定する。在場の仲間へ委任した時は実行者本人の能力・技能で1回判定する。同じ専門性の難度低下と技能加算、全員分の能力合算、順番の再試行は禁止。成長で同じ作業を難しくせず、失敗でも本筋の別手段を残す。
- id: M101
  subject: mid_late_encounter_rework
  canonical: NUMBERS
  rule: 新33点・少量共有成長・購入装備と薬の代表比較に基づき、中深層の命中壁と継続不能を個別調整する。5F蜂女王の命中/回避、6Fラミア、7F巨人の予告と待機、8Fリッチの再生核/有限MP、9Fクイーンの共有待機/小型召喚を正本化する。出目やHPを結果合わせで変えず、人数だけで敵を強化しない。
- id: M102
  subject: full_permanent_respec_and_stat_lp
  canonical: NUMBERS
  rule: 再訓練は100G・半日で恒久6能力の全ポイントを各3以上・同合計で再配分する。初期分と能力の実等の成長を含み、装備・火・一時効果は含めない。LPの実由来のBaseLPは独立して保持し6能力へ変換しない。stat_lp_bonus=max(0,(永久DEF-3)//2)、LP上限はBaseLP+丈夫さ+職業+火+一時補正、MP上限は実効INT。上限増加で現在値を回復せず、出生記録と実の使用履歴を改変しない。
- id: M103
  subject: lilith_staged_debt_and_absolute_relationship_gate
  canonical: OPERATIONS
  rule: 初期契約10,000Gを完済するまではリリスは絶対に主人公へなびかず、好意を表へ出さない。初回完済の特典は恋愛・親密な関係の解禁だけで、プレイヤーは拒否・保留できる。同じ精算で第二契約50,000Gへ更新し、以後は100,000G、150,000Gと更新する。恋愛や好意で免除せず、途中の任意増額もせず、確定完済台帳から解禁を導出する。旧完済3択特典の自動付与を置き換える。
- id: M104
  subject: named_cast_campaign_appearance_customization
  canonical: OPERATIONS
  rule: 第二契約50,000Gを全額完済するとリリスと登録ネームドの外見・体型変更を解禁する。プレイヤー指定・プレビュー・チャット確定後だけキャンペーン別上書きへ保存する。人格正本、人物ID、成人性、性格、口調、関係、職業、戦闘能力、LP/MP、装備所有と効果を変えない。関係解禁・加入・同意を外見変更で代替しない。
- id: M105
  subject: fixed_stage_topology_and_narrow_place_reading
  canonical: PLACE_ATLAS
  rule: 既存の町・村・施設を階数、外装、建材、部屋、扉・廊下・階段の接続、生活動線まで構造資料化する。通常進行では対象施設の構造と親町の短い案内だけを読み、全施設資料を毎回展開しない。構造上存在しても秘密の発見や入場許可にはならず、既存の料金・人物・数値・解禁条件を維持する。未定義の物語は自由に補い、破損・改装・新設等の変化はキャンペーンへ保存して再訪時に引き継ぐ。以前不採用となった悪役案は追加しない。地域の追加設定は最新決定に従う。
- id: M106
  subject: noir_and_nearby_life_calendar_and_funeral
  canonical: REGIONAL_WORLD
  rule: 既定の都市はノワールだけ。地方拡張の都市、人物、固有素材、海域と海賊は撤回し、テトラの故郷も未設定に戻す。既存の村・学園・洞窟・砦の構造は保持する。ノワールの暮らし、近郊からの流通、暦、葬送、街の代表とギルドの担当だけを必要分読む。既存の借金、価格、Tier、非売品、取立て、救助と死に戻りは維持する。
- id: M107
  subject: fire_before_allocation_and_plain_player_guidance
  canonical: TURN_CONTRACT
  rule: 新規導入は肉体の獲得、リリスの火の授与と短い説明、15点の初期配分、短い外出案内の順。火は基礎配分と別枠で保存し、初期配分画面では既にある火を含む最終値を予告する。普段の本文では内部の探索・遭遇回数、危険区画の消化数、在庫と内部キーを読み上げない。判断に必要な費用、消費、危険、能力変化は隠さず短く示し、詳しいルールは質問時と必要な場面で説明する。探索の数値規則はM108で更新する。成人向けイベントの追加調整は保留する。
- id: M108
  subject: free_exploration_daily_resources_boss_presence_and_incursions
  canonical: DUNGEON_DATA
  rule: 同階探索は無制限。出来事の対処ごとに未攻略ボスが接近し6で遭遇。攻略済みボスは帰還後に同じ個体として復活し、自発的な再訪時だけ会う。置かれた資源とボス戦利品は翌日以降の再入場で補充。確定配置の実は一度きり、ボス確率枠は初獲得まで30%・以後20%。長居すると下層の敵を中心に危険な襲来が起こり、逃走失敗や死の可能性がある。通常本文は世界観を味わう地の文を優先し、システム説明は必要時だけ。
- id: GM_VOICE_POLICY_4131
  subject: no_unsolicited_out_of_story_gm_voice
  canonical: CORE_RULES
  rule: GMの物語外発言は原則出さない。地の文・場面内の台詞・全システム表示、必要な短い操作案内と本人発信の質問への応答は維持する。GMの声の例外は既存のリリスのお仕置き、一意に復旧できない進行不能な異常通知、本当の停止など安全・同意の確認の3点だけで追加しない。お仕置きの5トリガー・ペナルティ・嘲笑と既存の数値・判定・難易度・追補・文体・セーブ形式を保持する。
- id: DISPLAY_AND_REPLY_4132
  subject: effective_allocation_display_and_light_reply_checks
  canonical: CORE_RULES
  rule: 配分画面の主表示は火等を含む最終能力とし、保存する基礎値・15点予算は変えない。既存の小説描写と字数枠を守り、通常の保存処理で本文字数と選択面だけを確認する。通常応答は毎回2つ以上の行動候補と自由入力を出し、操作待ちの実ウィジェットと短い質問・相槌を適切に扱う。長い点検文・毎ターンの追加AI処理は設けず、既存のGM発話3例外・数値・判定・セーブ形式を保持する。
- id: MOVEMENT_M51_4133
  subject: optional_movement_events_and_high_chance_town_wandering
  canonical: RANDOM_EVENT_RULES
  rule: 街・村と道中の通常の目的移動20％、目的地までぶらぶら40％。追加依頼を優先し街・村の目的なし散策80％、道中の目的なし散策や非移動の休憩等40％。緊急・直行は振らずダンジョンへ混用しない。移動候補は直行とぶらぶらを原則対で示し、緊急時は後者を出さない。移動イベントは通り過ぎられる小品だけでEV在庫を使わず、元の用事や到着を妨げない。リリス・ミルカが場面内で一度ずつ散策を案内する。既存の種別表・C-7とM47の分業・数値・判定式・セーブ形式・追補を維持する。
superseded:
- id: M29
  replaced_by: M33
  reason: 対抗判定を2d6から2d10へ改訂
- id: M37_single_check_targets
  replaced_by: M84
  reason: 同じ能力を両辺に足して相殺する相対目標値を固定目標値へ改訂
- id: M49
  replaced_by: M50
  reason: スキル初期案を最小形へ改訂
- id: M50_skill_slots
  replaced_by: M76
  reason: 取得・セット方式を再設計
- id: M88
  replaced_by: M90
  reason: 死に戻りの一律+2,000Gを、敵脅威と連動する危険帯別+500G/+1,000G/+1,500G/+2,000Gへ改訂
- id: GM_BRAIN
  replaced_by: M81
  reason: 表示と運用を廃止
lookup_policy:
- IDがactiveとsupersededの双方に現れた場合はactiveの最新改訂を優先する。
- この台帳が要約しない詳細は、canonicalに指定された現行資料を読む。制作時の全変更履歴を推測で補わない。
- 台帳とcanonical資料が異なる場合は正本レジストリの優先順位で再照合し、同順位の衝突だけ利用者へ確認する。
