      <path d="M82 312 L78 308"/><path d="M128 312 L132 308"/><path d="M84 336 L79 338"/><path d="M126 336 L131 338"/>
    </g>

    <!-- 塔 -->
    <ellipse cx="204" cy="452" rx="34" ry="9" fill="#000000" fill-opacity="0.18"/>
    <rect x="171" y="382" width="48" height="70" fill="#C9C4B8"/>
    <rect x="205" y="382" width="14" height="70" fill="#A8A397"/>
    <g stroke="#8E897F" stroke-width="1.5">
      <path d="M171 400 H219"/><path d="M171 418 H219"/><path d="M171 436 H219"/>
      <path d="M185 382 V400"/><path d="M203 400 V418"/><path d="M181 418 V436"/><path d="M211 436 V452"/>
