    <path d="M241 476 L244 460 L256 460 L259 476 Z" fill="#2F6FD6" stroke="#1B2233" stroke-width="2" stroke-linejoin="round"/>
    <path d="M243 468 H257" stroke="#E8B730" stroke-width="2.5"/>
