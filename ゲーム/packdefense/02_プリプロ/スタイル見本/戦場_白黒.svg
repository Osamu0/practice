<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <!-- スタイル見本：戦場の白黒版。中身は 戦場_色.svg と同じで、全体に彩度0のフィルタ（明るさの式は sRGB の 0.2126/0.7152/0.0722）をかけたもの。色を直したら両方を直す -->
  <defs>
    <filter id="gray" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="tile" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#A9CB8C"/>
      <rect width="32" height="32" fill="#A2C585"/>
      <rect x="32" y="32" width="32" height="32" fill="#A2C585"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#CFE4FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="landglow">
      <stop offset="0" stop-color="#4FA3FF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#4FA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="all" filter="url(#gray)" font-family="-apple-system, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
    <!-- 地面 -->
    <rect width="390" height="844" fill="url(#tile)"/>
    <rect x="173" y="0" width="44" height="844" fill="#DCCBA4"/>
    <rect x="0" y="408" width="390" height="44" fill="#DCCBA4"/>
    <ellipse cx="195" cy="446" rx="62" ry="26" fill="#8DB06F"/>

    <!-- 四隅の森と岩 -->
    <g stroke="#3E5E3A" stroke-width="2" fill="#5E8A55">
      <circle cx="22" cy="126" r="16"/><circle cx="46" cy="118" r="14"/><circle cx="34" cy="144" r="15"/>
      <circle cx="368" cy="124" r="16"/><circle cx="344" cy="132" r="14"/><circle cx="364" cy="150" r="15"/>
      <circle cx="20" cy="800" r="16"/><circle cx="44" cy="814" r="14"/><circle cx="24" cy="830" r="15"/>
      <circle cx="368" cy="800" r="16"/><circle cx="346" cy="816" r="14"/><circle cx="370" cy="830" r="15"/>
    </g>
    <g fill="#74A068">
      <circle cx="17" cy="121" r="5"/><circle cx="363" cy="119" r="5"/><circle cx="15" cy="795" r="5"/><circle cx="363" cy="795" r="5"/>
    </g>
    <path d="M4 400 L14 390 L28 394 L30 404 L6 406 Z" fill="#9A9488" stroke="#4A4640" stroke-width="2" stroke-linejoin="round"/>
    <path d="M362 472 L372 462 L386 466 L388 478 L364 480 Z" fill="#9A9488" stroke="#4A4640" stroke-width="2" stroke-linejoin="round"/>

    <!-- 魔物2：ゴブリン -->
    <path d="M181 262 L186 258 L190 263 L195 258 L200 263 L205 258 L209 262 L205 266 L195 267 L185 266 Z" fill="#2A1E2E" fill-opacity="0.35"/>
    <path d="M207 252 L219 236" stroke="#2A1E2E" stroke-width="7" stroke-linecap="round"/>
    <path d="M207 252 L219 236" stroke="#8A6A4A" stroke-width="4" stroke-linecap="round"/>
    <path d="M185 262 L183 246 Q195 236 207 246 L205 262 Z" fill="#5E5A66" stroke="#2A1E2E" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M187 236 L175 229 L188 243 Z" fill="#7A5A8C" stroke="#2A1E2E" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M203 236 L215 229 L202 243 Z" fill="#7A5A8C" stroke="#2A1E2E" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="195" cy="238" r="9" fill="#7A5A8C" stroke="#2A1E2E" stroke-width="2.5"/>
    <circle cx="191" cy="238" r="2.2" fill="#FFE14D"/>
    <circle cx="199" cy="238" r="2.2" fill="#FFE14D"/>
    <path d="M190 244 L192 242 L194 244 L196 242 L198 244 L200 242" stroke="#F2EFE8" stroke-width="1.3" fill="none"/>

