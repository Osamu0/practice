    <ellipse cx="302" cy="453" rx="16" ry="5" fill="#2A1E2E" fill-opacity="0.35"/>
    <path d="M284 452 C282 436 292 424 300 424 C310 424 318 436 316 452 Q308 448 300 452 Q292 448 284 452 Z" fill="#A8323E" stroke="#2A1E2E" stroke-width="2.5" stroke-linejoin="round"/>
