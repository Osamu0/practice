    <circle cx="250" cy="452" r="8" fill="#F3D2B3" stroke="#1B2233" stroke-width="2"/>
    <path d="M242 451 Q250 441 258 451 Z" fill="#D9DEE6" stroke="#1B2233" stroke-width="2" stroke-linejoin="round"/>
    <path d="M250 446 V442" stroke="#E8B730" stroke-width="3" stroke-linecap="round"/>
    <circle cx="247" cy="454" r="1.2" fill="#1B2233"/>
    <circle cx="253" cy="454" r="1.2" fill="#1B2233"/>

    <!-- コイン、ダメージの数 -->
    <circle cx="330" cy="460" r="5" fill="#FFD24A" stroke="#8A6A10" stroke-width="1.5"/>
    <text x="318" y="420" font-size="15" font-weight="700" fill="#FFFFFF" stroke="#1B2233" stroke-width="3" paint-order="stroke">12</text>

    <!-- 攻撃の輪と指 -->
    <ellipse cx="300" cy="496" rx="20" ry="24" fill="#1B2233" fill-opacity="0.18"/>
    <path d="M300 470 V478" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="300" cy="440" r="28" fill="#FFFFFF" fill-opacity="0.12" stroke="#1B2233" stroke-opacity="0.55" stroke-width="4.5"/>
    <circle cx="300" cy="440" r="28" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

    <!-- 危険の印 -->
    <path d="M6 430 L24 417 L24 443 Z" fill="#FF5A1F" stroke="#1B2233" stroke-width="2" stroke-linejoin="round"/>
    <text x="17.5" y="436" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text>

    <!-- HUD -->
    <rect x="8" y="52" width="374" height="52" rx="14" fill="#1F2A44" fill-opacity="0.9" stroke="#0E1526" stroke-width="1"/>
    <rect x="18" y="66" width="10" height="16" fill="#C9C4B8" stroke="#F2EFE8" stroke-width="1"/>
    <rect x="34" y="71" width="100" height="10" rx="5" fill="#0E1526"/>
    <rect x="35" y="72" width="70" height="8" rx="4" fill="#5FD38A"/>
