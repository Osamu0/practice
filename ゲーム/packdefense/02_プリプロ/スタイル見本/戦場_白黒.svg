    <text x="180" y="72" font-size="12" fill="#C9D3E6">ウェーブ</text>
    <text x="180" y="95" font-size="20" font-weight="700" fill="#FFFFFF">12</text>
    <circle cx="242" cy="79" r="8" fill="#FFD24A" stroke="#8A6A10" stroke-width="1.5"/>
    <text x="255" y="85" font-size="17" font-weight="700" fill="#FFFFFF">1.2万</text>
    <rect x="330" y="56" width="44" height="44" rx="10" fill="#2E3D60"/>
    <rect x="344" y="68" width="5" height="20" rx="1.5" fill="#FFFFFF"/>
    <rect x="355" y="68" width="5" height="20" rx="1.5" fill="#FFFFFF"/>

    <!-- 呪文の置き場 -->
    <rect x="119" y="692" width="68" height="90" rx="9" fill="#1F2A44" fill-opacity="0.8" stroke="#0E1526" stroke-width="1.5"/>
    <rect x="123" y="696" width="60" height="82" rx="6" fill="#3A2418" stroke="#FFC23A" stroke-width="3"/>
    <path d="M141 740 Q132 748 128 756 Q140 752 146 744 Z" fill="#FF7A2A" stroke="#1B2233" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="153" cy="728" r="13" fill="#FF7A2A" stroke="#1B2233" stroke-width="2"/>
    <circle cx="150" cy="725" r="6" fill="#FFE14D"/>
    <text x="153" y="766" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">火の玉</text>
    <g fill="#FFC23A"><circle cx="141" cy="773" r="1.8"/><circle cx="149" cy="773" r="1.8"/><circle cx="157" cy="773" r="1.8"/><circle cx="165" cy="773" r="1.8"/></g>
    <rect x="203" y="692" width="68" height="90" rx="9" fill="#1F2A44" fill-opacity="0.45" stroke="#C9D3E6" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="237" y="742" font-size="12" fill="#C9D3E6" text-anchor="middle">空き</text>

    <!-- ホームバー -->
    <rect x="128" y="831" width="134" height="5" rx="2.5" fill="#111111" fill-opacity="0.55"/>
  </g>
</svg>
