    <path d="M187 452 L187 436 Q195 426 203 436 L203 452 Z" fill="#5A4632" stroke="#3A3530" stroke-width="2"/>
    <rect x="167" y="366" width="56" height="18" fill="#C9C4B8" stroke="#3A3530" stroke-width="3"/>
    <rect x="167" y="356" width="12" height="12" fill="#C9C4B8" stroke="#3A3530" stroke-width="3"/>
    <rect x="189" y="356" width="12" height="12" fill="#C9C4B8" stroke="#3A3530" stroke-width="3"/>
    <rect x="211" y="356" width="12" height="12" fill="#C9C4B8" stroke="#3A3530" stroke-width="3"/>
    <path d="M195 356 V326" stroke="#3A3530" stroke-width="2"/>
