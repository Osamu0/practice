    <rect x="90" y="104" width="30" height="240" fill="url(#beam)"/>
    <ellipse cx="105" cy="344" rx="30" ry="10" fill="url(#landglow)"/>
    <rect x="90.5" y="304.5" width="29" height="41" rx="4" fill="#1B2233"/>
    <rect x="92" y="306" width="26" height="38" rx="3" fill="#23356B" stroke="#4FA3FF" stroke-width="3"/>
