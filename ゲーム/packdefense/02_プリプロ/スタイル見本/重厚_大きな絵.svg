<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
<!-- スタイル見本：重厚・大きな絵（図鑑・開封のカード、タイトル）の質感の決め。game-preprod-art 2026-11-27。
     この環境の SVG で描けるところまで。英雄は戦場の部品（案D）を拡大し、大きな絵だけに入れる描き込み（傷、刻印、布のしわ、2色の光のふち、紙の粒）を重ねた。
     本番の大きな絵は外部（絵描きか画像生成の道具）に頼む前提。この見本は「方向と色と光の決め」を伝えるためのもの。 -->
<style>
text{font-family:-apple-system,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans CJK JP',sans-serif}
.serif{font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif CJK JP',serif}
.nf{fill:none}
.lh{stroke:#1C1E24;stroke-width:.55;stroke-linejoin:round;stroke-linecap:round}
.lm{stroke:#140E16;stroke-width:.7;stroke-linejoin:round;stroke-linecap:round}
.lt{stroke:#2B2722;stroke-width:1.4;stroke-linejoin:round}
.thin{stroke-width:.4}
.s-ul{stroke:#1C1E24;fill:none}.s-ml{stroke:#140E16;fill:none}.s-tl{stroke:#2B2722;fill:none}
.s-grip{stroke:#4A3624;fill:none}.s-brass{stroke:#B8923A;fill:none}.s-wood{stroke:#5C4630;fill:none}
.hd{stroke:#5A6069;stroke-width:.35;fill:none;stroke-linecap:round}
.hd2{stroke:#6B4F36;stroke-width:.4;fill:none}
.hglint{stroke:#EEF0F2;stroke-width:.6;fill:none;stroke-linecap:round}
.hsteel{fill:#C9CDD2}.hsteelM{fill:#8E949C}.hsteelS{fill:#5A6069}
.hcloth{fill:#3F5C8C}.hclothS{fill:#2A3F63}
.hleather{fill:#6B4F36}.hleatherS{fill:#4A3624}.hbrass{fill:#B8923A}
.hskin{fill:#D9B596}.hskinS{fill:#B08C70}.hbrim{fill:#7A5E4A;fill-opacity:.55}
.eyeH{fill:#1C1E24}.hhair{fill:#4A3624}.htrou{fill:#3A3530}.hrivet{fill:#5A6069}
.hsh{fill:#141210;fill-opacity:.45}
.ring1{fill:#2E4A7A;fill-opacity:.35;stroke:#2E4A7A;stroke-width:.8}
.ring2{fill:#E8DFC4;fill-opacity:.28;stroke:#E8DFC4;stroke-width:.8}
.ring3{stroke:#E8DFC4;stroke-width:.6;fill:none}
.msh{fill:#140E16;fill-opacity:.45}
.mrag{fill:#4E4652}.mragS{fill:#3A3340}.mskin{fill:#5A4A5E}.mskinS{fill:#433646}
.eye{fill:#FFD84A}.mteeth{stroke:#D8CFB8;stroke-width:.6;fill:none}.mstud{fill:#8E949C}
.wolf{fill:#4E4A52}.wolfS{fill:#38343C}
.tsh{fill:#141210;fill-opacity:.35}
.st{fill:#8E8678}.stS{fill:#6A6358}.stD{fill:#6A6358}.stone2{fill:#7E7668}
.mort{stroke:#4E483F;stroke-width:.8;fill:none}
.slit{fill:#FFC870}.door{fill:#3A2C1E}.iron{stroke:#2B2722;stroke-width:.8;fill:none}.moss{fill:#3F4A30}
.flag{fill:#2E4A7A}.flagT{fill:none;stroke:#B8923A;stroke-width:.8;stroke-linejoin:round}
.rim{display:none}
.warm{stroke:#FFE2B0;fill:none;stroke-linecap:round}
.cool{stroke:#9FB8E8;fill:none;stroke-linecap:round}
.scr{stroke:#3A3E44;stroke-width:.22;fill:none;stroke-linecap:round}
.note{fill:#2A2622}.noteS{fill:#5A544C}
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2C3346"/>
    <stop offset="0.55" stop-color="#6A6670"/>
    <stop offset="1" stop-color="#C9A87A"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.18" cy="0.62" r="0.55">
    <stop offset="0" stop-color="#FFE2B0" stop-opacity="0.85"/>
    <stop offset="0.35" stop-color="#E8B878" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#E8B878" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vign" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#0E0C0A" stop-opacity="0.6"/>
  </radialGradient>
  <linearGradient id="ray" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFE2B0" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#FFE2B0" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5A5E44"/>
    <stop offset="1" stop-color="#2E3024"/>
  </linearGradient>
  <linearGradient id="kvsky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#262C3E"/>
    <stop offset="0.6" stop-color="#7A6A64"/>
    <stop offset="1" stop-color="#D2A46C"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="0.7" stop-color="#CFE4FF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/>
  </linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0 0.06  0.6 0 0 0 -0.25"/>
  </filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
  </filter>
  <clipPath id="artWin"><rect x="38" y="78" width="332" height="388" rx="4"/></clipPath>
  <clipPath id="kvWin"><rect x="408" y="64" width="568" height="320" rx="6"/></clipPath>

  <g id="heroBase">
    <ellipse class="hsh" cx="1.5" cy="0.5" rx="10" ry="3"/>
    <ellipse class="ring1" cx="0" cy="0" rx="16" ry="6"/>
    <ellipse class="ring2" cx="0" cy="0" rx="12.5" ry="4.4"/>
    <path class="ring3" d="M0 -6 V-4.4 M0 4.4 V6 M-16 0 H-12.5 M12.5 0 H16"/>
  </g>
  <g id="trouArt">
    <path class="htrou lh" d="M-8 -14 L-8.5 -6 L-2.5 -6 L-1.5 -14 Z"/>
    <path class="htrou lh" d="M1.5 -14 L2.5 -6 L8.5 -6 L8 -14 Z"/>
  </g>
  <g id="bootArt">
    <path class="hleatherS lh" d="M-9 -7 H-2 V0 H-11.5 Q-11.5 -3 -9 -4 Z"/>
    <path class="hleatherS lh" d="M2 -7 H9 V-4 Q11.5 -3 11.5 0 H2 Z"/>
    <path class="hd2" d="M-9 -5.5 H-2 M2 -5.5 H9"/>
  </g>
  <g id="upperArt">
    <path class="hcloth" d="M-9 -15 L9 -15 L11 -7 L4 -8 L0 -6.5 L-4 -8 L-11 -7 Z"/>
    <path class="hclothS" d="M0.5 -15 L9 -15 L11 -7 L4 -8 L0.5 -6.7 Z"/>
    <path class="lh nf" d="M-9 -15 L9 -15 L11 -7 L4 -8 L0 -6.5 L-4 -8 L-11 -7 Z"/>
    <path class="hsteel" d="M-10 -29 L10 -29 L9 -15 L-9 -15 Z"/>
    <path class="hsteelM" d="M1 -29 L10 -29 L9 -15 L0.5 -15 Z"/>
    <path class="hsteelS" d="M-9.2 -18 L9.2 -18 L9 -15 L-9 -15 Z"/>
    <path class="hglint" d="M-6.5 -27 L-4 -20.5"/>
    <path class="hd" d="M0.5 -28 V-18"/>
    <path class="lh nf" d="M-10 -29 L10 -29 L9 -15 L-9 -15 Z"/>
    <rect class="hleather lh" x="-9.5" y="-17" width="19" height="3"/>
    <rect class="hbrass lh thin" x="-1.8" y="-17.5" width="3.6" height="4"/>
    <path class="hsteel lh" d="M-16 -24 Q-17 -31 -9 -31 L-6.5 -27 Q-10 -23 -16 -24 Z"/>
    <path class="hsteelM lh" d="M16 -24 Q17 -31 9 -31 L6.5 -27 Q10 -23 16 -24 Z"/>
    <path class="hd" d="M-15 -26.5 Q-12 -28.5 -8.5 -28.5 M15 -26.5 Q12 -28.5 8.5 -28.5"/>
    <path class="hsteelS lh" d="M-14 -24 L-19 -18 L-12 -14 L-9.5 -16 L-14 -18 L-11.5 -22 Z"/>
    <circle class="hleatherS lh" cx="-10.5" cy="-15.5" r="2.6"/>
    <path class="hsteelM lh" d="M9 -26 L14.5 -24 L14.5 -18 L9.5 -18.5 Z"/>
    <path class="hsteel" d="M15.06 -18.7 L27.06 -39.48 L27.5 -43.85 L23.94 -41.28 L11.94 -20.5 Z"/>
    <path class="hsteelM" d="M13.5 -19.6 L25.5 -40.38 L27.5 -43.85 L27.06 -39.48 L15.06 -18.7 Z"/>
    <path class="hglint" d="M13.2 -21.2 L23.6 -39.2"/>
    <path class="lh nf" d="M15.06 -18.7 L27.06 -39.48 L27.5 -43.85 L23.94 -41.28 L11.94 -20.5 Z"/>
    <path class="s-ul" stroke-width="3.2" stroke-linecap="round" d="M13.5 -19.6 L10.5 -14.4"/>
    <path class="s-grip" stroke-width="2.4" stroke-linecap="round" d="M13.5 -19.6 L10.5 -14.4"/>
    <path class="s-ul" stroke-width="3.4" stroke-linecap="round" d="M18.26 -16.85 L8.74 -22.35"/>
    <path class="s-brass" stroke-width="2.4" stroke-linecap="round" d="M18.26 -16.85 L8.74 -22.35"/>
    <circle class="hbrass lh thin" cx="10.2" cy="-13.9" r="1.9"/>
    <circle class="hsteelS lh" cx="12" cy="-17" r="2.8"/>
  </g>
  <g id="headArt">
    <circle class="hskin" cx="0" cy="-35" r="7"/>
    <path class="hskinS" d="M2 -41.7 A7 7 0 0 1 2 -28.3 A9 9 0 0 0 2 -41.7 Z"/>
    <path class="hbrim" d="M-6.6 -38.6 H6.6 L6 -36.4 H-6 Z"/>
    <circle class="lh nf" cx="0" cy="-35" r="7"/>
    <rect class="eyeH" x="-3.6" y="-35" width="1.6" height="2.3"/>
    <rect class="eyeH" x="2" y="-35" width="1.6" height="2.3"/>
    <path class="hd" d="M-1.4 -30.8 H1.6"/>
    <path class="hhair lh thin" d="M5.5 -37.5 Q9.5 -35 7.2 -30.8 Q6.8 -34 5 -34.2 Z"/>
    <g transform="rotate(-8 0 -38)">
      <path class="hsteel" d="M-10.5 -38.5 Q-11 -51 0 -51.5 Q11 -51 10.5 -38.5 Z"/>
      <path class="hsteelM" d="M1 -51.45 Q11 -51 10.5 -38.5 L1 -38.5 Z"/>
      <path class="hglint" d="M-7 -48 Q-7.5 -45 -7 -41.5"/>
      <path class="hd" d="M0 -51.5 V-39.5 M5.5 -47.5 Q7 -46 6.5 -44"/>
      <path class="lh nf" d="M-10.5 -38.5 Q-11 -51 0 -51.5 Q11 -51 10.5 -38.5 Z"/>
      <path class="hsteelM" d="M-12 -39.5 L12 -39.5 L10.5 -36.5 L-10.5 -36.5 Z"/>
      <path class="hsteel" d="M-12 -39.5 L0 -39.5 L0 -36.5 L-10.5 -36.5 Z"/>
      <path class="lh nf" d="M-12 -39.5 L12 -39.5 L10.5 -36.5 L-10.5 -36.5 Z"/>
      <g class="hrivet"><circle cx="-6.5" cy="-41" r="0.8"/><circle cx="0" cy="-41.2" r="0.8"/><circle cx="6.5" cy="-41" r="0.8"/></g>
    </g>
  </g>
  <g id="hero">
    <use href="#heroBase"/>
    <path class="hclothS lh" d="M-10 -28 L-14 -5 Q-6 -2 0 -3 Q7 -2 13 -5 L10 -28 Z"/>
    <use href="#trouArt"/>
    <use href="#bootArt"/>
    <use href="#upperArt"/>
    <use href="#headArt"/>
  </g>
  <!-- 大きな絵だけの描き込み（英雄の座標のまま重ねる） -->
  <g id="heroDetail">
    <path class="scr" d="M-11 -24 L-12.5 -7 M-7 -22 L-8.5 -4.5 M8 -22 L9.5 -6 M11.5 -20 L12 -6"/>
