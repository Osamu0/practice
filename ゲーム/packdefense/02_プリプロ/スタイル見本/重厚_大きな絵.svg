  <text class="serif" x="430" y="124" font-size="44" font-weight="800" fill="#F2EDE0" stroke="#2A2218" stroke-width="5" paint-order="stroke">開けて守れ！</text>
  <text class="serif" x="434" y="150" font-size="16" fill="#E8D9B8" stroke="#2A2218" stroke-width="3" paint-order="stroke">タワーディフェンス（ロゴの字は仮）</text>
  <rect x="408" y="64" width="568" height="320" filter="url(#grain)"/>
</g>
<rect x="408" y="64" width="568" height="320" rx="6" fill="none" stroke="#8C7238" stroke-width="2"/>

<!-- 塔・魔物（タイトル用。案Dの部品を大きな絵の線の太さで） -->
