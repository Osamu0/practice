    <path class="warm" stroke-width=".5" d="M-15.6 -24.6 Q-16.5 -30.4 -9.4 -30.6 M-9.6 -28.6 L-9.1 -16 M11.6 -20.9 L23.6 -41.4"/>
    <path class="cool" stroke-width=".45" d="M15.7 -24.6 Q16.6 -30 10 -30.6 M12.7 -27 L12.6 -6 M26.8 -40 L15.5 -19.4"/>
    <path class="warm" stroke-width=".4" d="M-6.8 -36.5 Q-6.6 -39 -4.8 -40.8"/>
  </g>
</defs>

<rect width="1000" height="700" fill="#EDEAE3"/>
<text x="24" y="28" font-size="16" font-weight="700" fill="#1C1E24">重厚・大きな絵の質感（図鑑・開封のカード、タイトル）　案Dの色と光で、描き込みを足す</text>
<text x="24" y="48" font-size="11.5" fill="#555049">SVG で描けるところまでの見本。戦場の部品を拡大し、傷・刻印・しわ・2色の光のふち・紙の粒を重ねた。本番は外部に頼む（文言は 9.3）</text>

<!-- ===== 図鑑・開封のカード（縦 5:7） ===== -->
<rect x="24" y="64" width="360" height="504" rx="12" fill="#1C1A18"/>
<rect x="30" y="70" width="348" height="492" rx="9" fill="none" stroke="#8C7238" stroke-width="2"/>
<rect x="36" y="76" width="336" height="392" rx="5" fill="none" stroke="#4FA3FF" stroke-width="2"/>
<g clip-path="url(#artWin)">
  <rect x="38" y="78" width="332" height="388" fill="url(#sky)"/>
  <rect x="38" y="78" width="332" height="388" fill="url(#sun)"/>
  <g filter="url(#rough)">
    <path d="M30 330 L80 290 L120 305 L170 262 L220 300 L260 280 L320 310 L380 285 L380 470 L30 470 Z" fill="#4E5060" fill-opacity="0.75"/>
    <path d="M290 300 V262 H298 V252 H304 V262 H316 V240 H322 V230 H328 V240 H334 V275 H346 V300 Z" fill="#3E4150" fill-opacity="0.9"/>
    <path d="M30 372 Q120 336 210 356 T380 346 L380 470 L30 470 Z" fill="#454A3A"/>
  </g>
  <path d="M38 78 L150 78 L300 466 L200 466 Z" fill="url(#ray)" opacity="0.5"/>
  <path d="M38 140 L90 78 L260 466 L170 466 Z" fill="url(#ray)" opacity="0.35"/>
  <path d="M30 410 Q200 388 380 404 L380 470 L30 470 Z" fill="url(#ground)"/>
  <ellipse cx="214" cy="434" rx="120" ry="14" fill="#141210" fill-opacity="0.4"/>
  <g transform="translate(196 430) scale(5.8)">
    <use href="#hero"/>
    <use href="#heroDetail"/>
  </g>
  <g fill="#FFE2B0" fill-opacity="0.7">
    <circle cx="80" cy="200" r="1.2"/><circle cx="110" cy="240" r="0.9"/><circle cx="66" cy="300" r="1.1"/><circle cx="130" cy="180" r="0.8"/><circle cx="300" cy="160" r="0.9"/>
  </g>
  <rect x="38" y="78" width="332" height="388" fill="url(#vign)"/>
  <rect x="38" y="78" width="332" height="388" filter="url(#grain)"/>
</g>
<rect x="36" y="474" width="336" height="80" rx="5" fill="#26221E" stroke="#8C7238" stroke-width="1.5"/>
<text class="serif" x="52" y="504" font-size="22" font-weight="700" fill="#F2EDE0">剣士</text>
<text x="112" y="503" font-size="12" fill="#C9C2B0">（名前は仮。オーナー未決）</text>
<g fill="#4FA3FF"><circle cx="346" cy="497" r="4"/><circle cx="332" cy="497" r="4"/></g>
<text x="52" y="530" font-size="12" fill="#C9C2B0">レア度の色はカードの内側の細い枠と点だけ（ここではレア：青・点2）</text>
<text x="52" y="546" font-size="12" fill="#C9C2B0">鉄の枠と真鍮のふちは、すべてのカードで同じ</text>

<!-- ===== タイトル（キービジュアルの構図の見本） ===== -->
<g clip-path="url(#kvWin)">
  <rect x="408" y="64" width="568" height="320" fill="url(#kvsky)"/>
  <ellipse cx="470" cy="300" rx="260" ry="140" fill="#FFD9A0" fill-opacity="0.22"/>
