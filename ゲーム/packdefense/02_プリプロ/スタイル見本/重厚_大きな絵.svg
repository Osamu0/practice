  <g transform="translate(606 372) scale(1.6)"><use href="#hero"/></g>
  <g transform="translate(786 376) scale(1.6)"><use href="#hero"/></g>
  <g transform="translate(456 366) scale(1.5)"><use href="#goblin"/></g>
  <g transform="translate(932 370) scale(-1.5 1.5)"><use href="#wolf"/></g>
