<!-- ===== 質感の決め（文字） ===== -->
<g font-size="10.5">
  <text class="note" x="408" y="412" font-size="14" font-weight="700">大きな絵の質感の決め（戦場の絵との違い）</text>
  <text class="note" x="408" y="434">・形と色と頭身は戦場と同じ（3頭身、大きすぎる兜、剣は画面の右上、腰に手）。同じ人に見えることが第一</text>
  <text class="note" x="408" y="454">・縁取りは細く（拡大しても 2〜4px 相当）、強弱をつけてよい。面は 3段＋やわらかい移り（ぼかし）を許す</text>
  <text class="note" x="408" y="474">・光は2つ：左上の暖かい主光 #FFE2B0 と、右うしろの冷たい返しの光 #9FB8E8（金属のふちだけ）</text>
  <text class="note" x="408" y="494">・描き込み：鎧の小傷、胸の王国の紋の刻印、ベルトの縫い目、マントのしわと裾の擦れ、ブーツの泥</text>
  <text class="note" x="408" y="514">・背景：夕方前の空、遠くの山と城の影、手前は暗い草地。人物より彩度とコントラストを下げる</text>
  <text class="note" x="408" y="534">・紙の粒（細かいノイズ 5〜10%）と、四隅を少し暗く。写真のような質感、強い光沢、血は入れない</text>
  <text class="note" x="408" y="554">・カードの枠は全員共通の鉄と真鍮。レア度は内側の細い枠の色と点の数（形で読む決まりは戦場と同じ）</text>
  <text class="noteS" x="408" y="584">気になる点：この見本の英雄は戦場の部品を拡大したもので、形は単純なまま。オーナーが求める「凝った」大きな絵の</text>
  <text class="noteS" x="408" y="602">密度（布や金属の描き込み、手描きの線）は、この環境では出せない。本番は外部に頼む前提で、ここは色・光・構図の決め</text>
  <text class="noteS" x="408" y="632">タイトルは構図の見本：中央に塔、手前に英雄、左右の暗がりに魔物の目、空からパックの光の柱。ロゴは仮の字</text>
</g>
</svg>
