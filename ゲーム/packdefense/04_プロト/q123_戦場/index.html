<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>開けて守れ！ プロト q123</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #1B2233; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; color: #1B2233; }
  #field { position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; display: block; }
  #hud { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 5px); height: 52px; display: flex; align-items: center;
    gap: 8px; padding: 0 8px 0 12px; pointer-events: none; font-weight: 700; }
  #hud .box { background: rgba(255,255,255,.82); border: 1.5px solid #1B2233; border-radius: 10px; height: 36px; display: flex; align-items: center; padding: 0 10px; font-size: 16px; }
  #hpbar { width: 70px; height: 10px; background: #ddd; border-radius: 5px; overflow: hidden; margin-right: 6px; border: 1px solid #1B2233; }
  #hpfill { height: 100%; background: #3BAA5C; width: 100%; }
  #hpfill.danger { background: #E5484D; animation: blink .5s infinite alternate; }
  @keyframes blink { from { opacity: 1 } to { opacity: .35 } }
  #timer { font-size: 12px; font-weight: 600; margin-left: 2px; }
  #pause { pointer-events: auto; margin-left: auto; width: 48px; height: 48px; border: 0; background: none; padding: 2px; }
  #pause span { display: flex; width: 44px; height: 44px; border-radius: 10px; background: rgba(255,255,255,.82); border: 1.5px solid #1B2233; align-items: center; justify-content: center; font-size: 18px; box-sizing: border-box; }
  .layer { position: fixed; inset: 0; display: none; z-index: 10; }
  .layer.on { display: flex; }
  #cover { background: rgba(27,34,51,.55); align-items: center; justify-content: center; flex-direction: column; color: #fff; text-align: center; }
  #cover h1 { font-size: 26px; margin: 0 0 6px; }
  #cover p { margin: 4px 16px; font-size: 15px; }
  #panel { background: rgba(27,34,51,.45); align-items: flex-end; justify-content: center; }
  #sheet { background: #FBF8F1; width: 100%; max-height: calc(100% - env(safe-area-inset-top) - 24px); border-radius: 16px 16px 0 0; display: flex; flex-direction: column;
    box-sizing: border-box; padding-bottom: calc(env(safe-area-inset-bottom) + 8px); }
  #sheet .head { padding: 14px 16px 6px; font-size: 19px; font-weight: 800; }
  #sheet .body { overflow-y: auto; padding: 0 16px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  #sheet .foot { padding: 8px 16px 0; display: flex; flex-direction: column; gap: 8px; }
  .row { margin: 10px 0; }
  .row .lab { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .row .sub { font-size: 12px; color: #555; margin-top: 3px; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg button { min-width: 48px; min-height: 48px; flex: 1; font-size: 15px; border-radius: 10px; border: 1.5px solid #1B2233; background: #fff; font-weight: 700; color: #1B2233; padding: 0 6px; }
  .seg button.on { background: #2F6FD6; color: #fff; border-color: #1B2F5E; }
  .main { min-height: 56px; font-size: 18px; font-weight: 800; border-radius: 12px; border: 1.5px solid #1B2F5E; background: #2F6FD6; color: #fff; width: 100%; }
  .sec { min-height: 48px; font-size: 16px; font-weight: 700; border-radius: 12px; border: 1.5px solid #1B2233; background: #fff; color: #1B2233; width: 100%; }
  .two { display: flex; gap: 8px; } .two > * { flex: 1; }
  .card { background: #fff; border: 1.5px solid #1B2233; border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
  .card .t { font-weight: 800; font-size: 16px; }
  .card .s { font-size: 12px; color: #444; margin: 3px 0 8px; line-height: 1.5; }
  .card button { min-height: 48px; }
  .big { font-size: 28px; font-weight: 800; margin: 6px 0; }
  table.st { border-collapse: collapse; width: 100%; font-size: 13px; } table.st td { border-bottom: 1px solid #ddd; padding: 5px 2px; } table.st td:last-child { text-align: right; font-weight: 700; }
  textarea { width: 100%; box-sizing: border-box; font-size: 12px; font-family: ui-monospace, Menlo, monospace; border-radius: 8px; border: 1.5px solid #1B2233; padding: 6px; -webkit-user-select: text; user-select: text; }
  #toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 64px); background: rgba(27,34,51,.9); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 14px; display: none; z-index: 20; pointer-events: none; }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div id="hud">
  <div class="box"><div id="hpbar"><div id="hpfill"></div></div><span id="hp">100</span></div>
  <div class="box" id="wave">第1</div>
  <div class="box" id="coins">● 0</div>
  <span id="timer"></span>
  <button id="pause" aria-label="一時停止"><span>Ⅱ</span></button>
</div>
<div id="cover" class="layer"></div>
<div id="panel" class="layer"><div id="sheet"><div class="head" id="sh"></div><div class="body" id="sb"></div><div class="foot" id="sf"></div></div></div>
<div id="toast"></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
