  <!-- スタイル見本：戦場（iPhone 縦、論理ピクセル 390x844）。推す案「台座のミニチュア」。game-preprod-art 2026-11-25 -->
  <defs><filter id="gsall" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/></filter>
    <pattern id="tile" width="64" height="64" patternUnits="userSpaceOnUse">
