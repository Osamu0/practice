<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe6d2">
<link rel="manifest" href="./manifest.webmanifest">
<title>技術確認（捨てる前提）</title>
<style>
  :root { --paper:#efe6d2; --ink:#2b2621; --mark:#b5482f; --cell: min(17vw, 9dvh, 72px); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink);
    font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-tap-highlight-color: transparent; }
  body { display:flex; flex-direction:column; height:100dvh; padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom); user-select:none; -webkit-user-select:none; }
  header { font-size:14px; padding:6px 0; line-height:1.5; }
  #board { margin: 4px auto; display:grid; grid-template-columns: repeat(5, var(--cell)); gap:3px; touch-action:none; }
  .cell { width:var(--cell); height:var(--cell); border:1.5px solid var(--ink); border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:calc(var(--cell) * 0.42); background:#f7f1e3; }
  .cell.next { outline:3px dashed var(--mark); outline-offset:-5px; }
  #log { flex:1; overflow:auto; font-size:13px; padding:4px; border-top:1px solid #0003; min-height:3em; }
  /* 親指の届く下半分に操作を集める */
  #thumb { padding-bottom:8px; }
  #shelf { display:flex; gap:6px; justify-content:center; margin:6px 0; touch-action:none; }
  .part { flex:1; max-width:84px; min-height:52px; border:2px solid var(--ink); border-radius:8px; background:#fff8; font-size:20px; text-align:center; }
  .part.sel { background:var(--ink); color:var(--paper); }
  .part small { display:block; font-size:12px; }
  .row { display:flex; gap:6px; }
  button { font: inherit; min-height:48px; }
  .row button { flex:1; border:2px solid var(--ink); border-radius:8px; background:transparent; }
  #step { background:var(--ink); color:var(--paper); font-size:18px; }
  #ghost { position:fixed; pointer-events:none; font-size:32px; transform:translate(-50%,-110%); display:none; }
  #io { display:none; margin-top:6px; } #io.open { display:block; }
  #io textarea { width:100%; height:5em; font-size:11px; }
</style>
</head>
<body>
  <header><div id="info"></div><div id="persist" style="font-size:11px;opacity:.7"></div></header>
  <div id="board" aria-label="盤面"></div>
  <div id="log" aria-live="polite"></div>
  <div id="thumb">
    <div id="shelf"></div>
    <div class="row"><button id="io-btn">書き出し・読み込み</button><button id="new">新しいシード</button><button id="step">1手進める</button></div>
    <div id="io">
      <textarea id="io-text" aria-label="書き出しの文字列"></textarea>
      <div class="row"><button id="exp">文字で書き出す</button><button id="dl">ファイルに保存</button><button id="imp">文字を読む</button></div>
      <div class="row" style="margin-top:6px"><label style="flex:1">ファイルを読む <input id="file" type="file" accept=".txt,text/plain"></label></div>
    </div>
  </div>
  <div id="ghost"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
